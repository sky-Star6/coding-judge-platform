<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알고리즘 훈련장 - 학습 대시보드</title>
    <!-- 프리텐다드 웹폰트 (Pretendard Font) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 공통 사이트 셸 스타일시트 (Shared Site Shell CSS) -->
    <link rel="stylesheet" href="/static/css/platform-shell.css">
    <style>
        /* 페이지 상단 안내 섹션 (Page Intro Section) - materials.html 구조 모델링 */
        .page-intro {
            padding: 24px 0 20px 0;
            border-bottom: 1px solid var(--color-border-subtle);
            margin-bottom: 24px;
        }

        /* 상단 안내 뱃지 간격 (Badge Spacing) */
        .page-intro-badge {
            margin-bottom: 8px;
        }

        /* 페이지 메인 제목 스타일 (Main Title Typography) */
        .page-intro-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        /* 페이지 상세 설명 문구 (Description Paragraph) */
        .page-intro-desc {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            max-width: 720px;
            line-height: 1.6;
        }

        /* 대시보드 메인 그리드 레이아웃 (Dashboard Grid Layout) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 24px;
            align-items: start;
        }

        /* 1. 문제 필터 및 컨트롤 바 (Problem Controls) */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--color-border-subtle);
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-heading {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-text-primary);
            letter-spacing: -0.01em;
        }

        .filter-controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .solve-filter-group {
            display: inline-flex;
            background-color: var(--color-bg-subtle);
            padding: 2px;
            border-radius: var(--border-radius-md);
            border: 1px solid var(--color-border-subtle);
        }

        .filter-tab-btn {
            border: none;
            background: none;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s;
            min-height: 32px;
        }

        .filter-tab-btn.active {
            background-color: var(--color-bg-surface);
            color: var(--color-accent);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        }

        /* 난이도 네비게이션 탭 (Difficulty Navigation) */
        .diff-nav {
            display: flex;
            background-color: var(--color-bg-subtle);
            border: 1px solid var(--color-border-default);
            border-radius: var(--border-radius-md);
            overflow: hidden;
            margin-bottom: 16px;
        }

        .diff-nav-item {
            flex: 1;
            text-align: center;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            background-color: transparent;
            border: 0;
            cursor: pointer;
            border-right: 1px solid var(--color-border-subtle);
            transition: background-color 0.15s, color 0.15s;
            user-select: none;
        }

        .diff-nav-item:last-child {
            border-right: none;
        }

        .diff-nav-item:hover {
            background-color: var(--color-bg-muted);
            color: var(--color-text-primary);
        }

        .diff-nav-item.active {
            background-color: var(--color-accent);
            color: var(--color-text-inverse);
        }

        /* 문제 목록 카드 리스트 (Problem List & Cards) */
        .problem-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .problem-card {
            background-color: var(--color-bg-surface);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--border-radius-lg);
            padding: 18px 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .problem-card:hover {
            border-color: var(--color-accent);
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
        }

        .problem-info {
            flex: 1;
            min-width: 0;
        }

        .problem-info h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .problem-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .solve-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 6px 14px;
            font-size: 0.875rem;
            font-weight: 600;
            background-color: transparent;
            color: var(--color-accent);
            border: 1px solid var(--color-accent);
            border-radius: var(--border-radius-md);
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .problem-card:hover .solve-btn:not([disabled]) {
            background-color: var(--color-accent);
            color: var(--color-text-inverse);
        }

        /* 페이지네이션 (Pagination) */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            background-color: var(--color-bg-surface);
            border: 1px solid var(--color-border-default);
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s, border-color 0.15s;
            user-select: none;
        }

        .page-btn:hover:not(.active) {
            background-color: var(--color-bg-subtle);
            color: var(--color-text-primary);
        }

        .page-btn.active {
            background-color: var(--color-accent);
            color: var(--color-text-inverse);
            border-color: var(--color-accent);
        }

        /* 사이드바 위젯 (Sidebar Panels) */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stat-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .stat-card {
            background-color: var(--color-bg-subtle);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--border-radius-md);
            padding: 12px;
            text-align: center;
        }

        .stat-card-label {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-bottom: 4px;
        }

        .stat-card-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--color-text-primary);
        }

        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--color-border-subtle);
            font-size: 0.9rem;
        }

        .ranking-item:last-child {
            border-bottom: none;
        }

        .rank-number {
            font-weight: 700;
            width: 24px;
            color: var(--color-text-muted);
            text-align: center;
        }

        .rank-number.top-rank {
            color: var(--color-accent);
        }

        .rank-nickname {
            flex-grow: 1;
            font-weight: 600;
            color: var(--color-text-primary);
            padding: 0 8px;
        }

        .rank-score {
            font-weight: 700;
            color: var(--color-accent);
        }

        /* 390px 모바일 및 태블릿 대응 */
        @media (max-width: 900px) {
            .page-intro {
                padding: 16px 0 16px 0;
                margin-bottom: 20px;
            }

            .page-intro-title {
                font-size: 1.35rem;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .filter-controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .solve-filter-group {
                width: 100%;
                display: flex;
            }
            .filter-tab-btn {
                flex: 1;
                text-align: center;
            }
            .problem-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .solve-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- 전역 로딩 오버레이 -->
    <div id="loading-overlay" style="position:fixed; inset:0; background:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; z-index:9999; font-size:1.2rem; color:var(--color-text-muted);">
        로딩 중...
    </div>

    <!-- 시맨틱 헤더 (Site Header) -->
    <header class="site-header">
        <div class="site-header-inner">
            <a href="index.html" class="site-brand">
                <span>알고리즘 훈련장</span>
            </a>
            <nav class="site-nav" aria-label="주요 서비스 탐색">
                <a href="materials.html" class="site-nav-link">학습 자료실</a>
                <a href="index.html" class="site-nav-link active" aria-current="page">학습 대시보드</a>
                <a href="user_assignments.html" class="site-nav-link">내 과제함</a>
            </nav>
            <div class="site-user-meta">
                <span id="nav-nickname" style="font-weight:600; color:var(--color-text-primary);"></span>
                <button onclick="logout()" class="btn btn-secondary btn-sm" aria-label="로그아웃">로그아웃</button>
            </div>
        </div>
    </header>

    <!-- 대시보드 메인 레이아웃 (Dashboard Container) -->
    <main class="app-container">

        <!-- 1. 페이지 안내 섹션 (Page Intro Section - materials.html 구조 모델링) -->
        <section class="page-intro" aria-labelledby="dashboard-title">
            <span class="badge badge-primary page-intro-badge">학습 대시보드</span>
            <h1 class="page-intro-title" id="dashboard-title">알고리즘 문제 풀이 및 학습 현황</h1>
            <p class="page-intro-desc">
                다양한 난이도의 프로그래밍 문제를 해결하며 실력을 기르고 실시간 채점 결과 및 학습 통계를 확인하세요.
            </p>
        </section>

        <!-- 2. 메인 그리드 (문제 풀기 + 사이드바 학습 통계) -->
        <div class="dashboard-grid">

            <!-- 좌측 컬럼: 문제 풀기 섹션 (Problem Solving Section) -->
            <section aria-labelledby="problem-section-title">
                <div class="section-header">
                    <h2 class="section-heading" id="problem-section-title">문제 풀기</h2>
                    <!-- 언어 필터 -->
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label for="lang-filter" style="font-size: 0.85rem; font-weight: 600; color: var(--color-text-secondary);">언어 선택:</label>
                        <select id="lang-filter" class="form-select" onchange="selectLang(this.value)" style="min-height: 36px; padding: 4px 10px; width: auto; font-size: 0.85rem;">
                            <option value="python3" selected>Python 3</option>
                            <option value="java">Java</option>
                        </select>
                    </div>
                </div>

                <!-- 필터 컨트롤 바 (풀이 여부) -->
                <div class="filter-controls-bar">
                    <div class="solve-filter-group" role="tablist" aria-label="풀이 여부 필터">
                        <button type="button" class="filter-tab-btn active" id="solve-filter-all" onclick="selectSolveFilter('all')" role="tab" aria-selected="true">전체 문제</button>
                        <button type="button" class="filter-tab-btn" id="solve-filter-solved" onclick="selectSolveFilter('solved')" role="tab" aria-selected="false">푼 문제</button>
                        <button type="button" class="filter-tab-btn" id="solve-filter-unsolved" onclick="selectSolveFilter('unsolved')" role="tab" aria-selected="false">안 푼 문제</button>
                    </div>
                </div>

                <!-- 난이도 탭 네비게이션 (Difficulty Navigation) -->
                <nav class="diff-nav" id="diff-nav" aria-label="난이도별 탭">
                    <button type="button" class="diff-nav-item active" onclick="selectDiff('0', this)" aria-pressed="true">입문 문제</button>
                    <button type="button" class="diff-nav-item" onclick="selectDiff('1', this)" aria-pressed="false">3급 테스트</button>
                    <button type="button" class="diff-nav-item" onclick="selectDiff('3', this)" aria-pressed="false">2급 테스트</button>
                    <button type="button" class="diff-nav-item" onclick="selectDiff('5', this)" aria-pressed="false">1급 테스트</button>
                </nav>

                <!-- 문제 목록 컨테이너 -->
                <div class="problem-list" id="problem-list-container" aria-live="polite">
                    <div class="state-box">문제 목록을 불러오는 중입니다...</div>
                </div>

                <!-- 페이지네이션 영역 -->
                <nav class="pagination" id="pagination-container" aria-label="문제 페이지 목록"></nav>
            </section>

            <!-- 우측 컬럼: 사이드바 학습 통계 & 랭킹 (Learning History & Sidebar) -->
            <aside class="sidebar" aria-label="학습 통계 및 랭킹">

                <!-- 1. 누적 종합 포인트 패널 (Total Points Panel) -->
                <div class="panel total-points-prominent" id="total-points-panel">
                    <div class="panel-header">
                        <h3 class="panel-title">종합 포인트</h3>
                    </div>
                    <div id="total-points-content">
                        <div style="text-align:center; color:var(--color-text-muted); font-size:0.85rem;">포인트 로딩 중...</div>
                    </div>
                </div>

                <!-- 2. 내 풀이 현황 패널 -->
                <div class="panel" id="my-stats-panel">
                    <div class="panel-header">
                        <h3 class="panel-title">내 풀이 현황</h3>
                    </div>
                    <div id="my-stats-content">
                        <div style="text-align:center; color:var(--color-text-muted); font-size:0.85rem;">통계 로딩 중...</div>
                    </div>
                </div>

                <!-- 월간 점수 패널 -->
                <div class="panel" id="monthly-score-panel">
                    <div class="panel-header">
                        <h3 class="panel-title">월간 점수 현황</h3>
                    </div>
                    <div id="monthly-score-content">
                        <div style="text-align:center; color:var(--color-text-muted); font-size:0.85rem;">점수 로딩 중...</div>
                    </div>
                </div>

                <!-- 명예의 전당 / 랭킹 패널 -->
                <div class="panel">
                    <div class="panel-header">
                        <h3 class="panel-title">명예의 전당</h3>
                        <button onclick="fetchRanking()" class="btn btn-secondary btn-sm" style="min-height: 28px; padding: 2px 8px; font-size: 0.75rem;">새로고침</button>
                    </div>
                    <ul class="ranking-list" id="ranking-container">
                        <div style="text-align: center; color: var(--color-text-muted); padding: 16px; font-size: 0.85rem;">랭킹을 조회하고 있습니다...</div>
                    </ul>
                </div>

            </aside>

        </div>
    </main>

    <script>
        const API_BASE_URL = '/api';

        // --- 1. 로그인 여부 및 권한 즉시 검증 ---
        const userId = localStorage.getItem('user_id');
        const nickname = localStorage.getItem('nickname') || '';
        let userRole = localStorage.getItem('role') || 'level_3';

        if (userRole.endsWith('_adv')) {
            userRole = userRole.replace('_adv', '');
            localStorage.setItem('role', userRole);
        }

        if (!userId) {
            window.location.href = 'auth.html';
        } else if (userRole === 'beginner') {
            // [요구사항 4] 기초반(beginner) 사용자가 대시보드(index.html)에 도달한 경우 학습 자료실로 즉시 리다이렉트합니다.
            window.location.href = 'materials.html';
        }

        // 신뢰할 수 없는 닉네임을 HTML로 해석하지 않고 등급 뱃지를 구성합니다.
        function appendRoleBadge(container, role) {
            const badge = document.createElement('span');
            badge.className = 'badge';
            const labels = { admin: '관리자', level_1: '1급', level_2: '2급', level_3: '3급', beginner: '기초반' };
            badge.textContent = labels[role] || '3급';
            if (role === 'level_1') badge.classList.add('badge-diff-5');
            else if (role === 'level_2') badge.classList.add('badge-diff-3');
            else if (role === 'admin') badge.style.cssText = 'background-color:#7c3aed; color:white;';
            else if (role === 'beginner') badge.style.cssText = 'background-color:#0284c7; color:white;';
            else badge.classList.add('badge-diff-1');
            container.append(' ', badge);
        }

        function getDifficultyName(diffCode) {
            const diffMap = {
                0: '입문 문제',
                1: '3급 테스트',
                3: '2급 테스트',
                5: '1급 테스트'
            };
            return diffMap[parseInt(diffCode)] || `난이도 ${diffCode}`;
        }

        // 헤더 닉네임 교체 및 내 등급 뱃지 표시
        const navNicknameEl = document.getElementById('nav-nickname');
        if (navNicknameEl) {
            navNicknameEl.textContent = nickname;
            appendRoleBadge(navNicknameEl, userRole);
        }

        if (userRole === 'admin') {
            const userMetaDiv = document.querySelector('.site-user-meta');
            if (userMetaDiv) {
                const adminLink = document.createElement('a');
                adminLink.href = 'admin_users.html';
                adminLink.className = 'btn btn-secondary btn-sm';
                adminLink.style.cssText = 'color:#7c3aed; border-color:#c4b5fd;';
                adminLink.textContent = '관리자 통제소';
                userMetaDiv.prepend(adminLink);
            }
        }

        // [요구사항 2] 로그아웃 함수: 서버 측 플라스크 세션을 클리어하고 로컬 스토리지를 삭제한 뒤 이동합니다.
        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch (err) {
                console.error('로그아웃 요청 실패:', err);
            }
            localStorage.clear();
            window.location.href = 'auth.html';
        }

        // 상태 변수
        let currentDiffFilter = '0';
        let currentLangFilter = localStorage.getItem('preferred_language') || 'python3';
        let currentSolveFilter = 'all'; // all, solved, unsolved
        let currentPage = 1;
        const ITEMS_PER_PAGE = 10;

        // 언어 필터 변경
        function selectLang(lang) {
            currentLangFilter = lang;
            localStorage.setItem('preferred_language', lang);
            currentPage = 1;
            fetchProblems();
        }

        // 풀이 여부 필터 변경
        function selectSolveFilter(filterType) {
            currentSolveFilter = filterType;
            const btnAll = document.getElementById('solve-filter-all');
            const btnSolved = document.getElementById('solve-filter-solved');
            const btnUnsolved = document.getElementById('solve-filter-unsolved');

            if (btnAll) {
                btnAll.classList.toggle('active', filterType === 'all');
                btnAll.setAttribute('aria-selected', filterType === 'all');
            }
            if (btnSolved) {
                btnSolved.classList.toggle('active', filterType === 'solved');
                btnSolved.setAttribute('aria-selected', filterType === 'solved');
            }
            if (btnUnsolved) {
                btnUnsolved.classList.toggle('active', filterType === 'unsolved');
                btnUnsolved.setAttribute('aria-selected', filterType === 'unsolved');
            }

            currentPage = 1;
            fetchProblems();
        }

        // 난이도 탭 선택
        function selectDiff(diffValue, tabElement) {
            currentDiffFilter = diffValue;
            currentPage = 1;

            document.querySelectorAll('.diff-nav-item').forEach(el => {
                el.classList.remove('active');
                el.setAttribute('aria-pressed', 'false');
            });
            tabElement.classList.add('active');
            tabElement.setAttribute('aria-pressed', 'true');

            fetchProblems();
        }

        // 초기 데이터 로딩
        document.addEventListener('DOMContentLoaded', () => {
            const langFilterEl = document.getElementById('lang-filter');
            if (langFilterEl) langFilterEl.value = currentLangFilter;
            fetchProblems();
            fetchRanking();
            fetchMyStats();
            fetchMonthlyScores();
            fetchTotalPoints();
        });

        // 종합 포인트 조회
        async function fetchTotalPoints() {
            const div = document.getElementById('total-points-content');
            try {
                const res = await fetch(`${API_BASE_URL}/user-points?user_id=${userId}`);
                const data = await res.json();

                div.innerHTML = `
                    <div style="text-align:center; padding: 8px 0 16px 0; border-bottom: 1px solid var(--color-border-subtle); margin-bottom: 12px;">
                        <div style="font-size:0.8rem; color:var(--color-text-muted); margin-bottom:2px;">누적 종합 포인트</div>
                        <div style="font-size:2rem; font-weight:800; color:var(--color-accent);">${data.total_points || 0}<span style="font-size:0.9rem; font-weight:600; color:var(--color-text-muted);"> pt</span></div>
                    </div>
                    <div class="stat-grid-2">
                        <div class="stat-card">
                            <div class="stat-card-label">문제 풀이</div>
                            <div class="stat-card-value">${data.solve_score || 0}점</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">보너스 점수</div>
                            <div class="stat-card-value">${data.bonus_points || 0}점</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">오늘 푼 문제</div>
                            <div class="stat-card-value">${data.today_solved_count || 0}개</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">오늘 답안 열람</div>
                            <div class="stat-card-value">${data.today_viewed_count || 0}회</div>
                        </div>
                    </div>
                `;
            } catch (e) {
                div.innerHTML = '<div class="state-error" style="font-size:0.85rem;">포인트를 불러올 수 없습니다.</div>';
            }
        }

        // 내 풀이 통계 조회
        async function fetchMyStats() {
            const statsDiv = document.getElementById('my-stats-content');
            try {
                const res = await fetch(`${API_BASE_URL}/problems?user_id=${userId}`);
                const data = await res.json();
                const problems = data.problems || [];

                const totalProblems = problems.length;
                const solvedPython = problems.filter(p => p.is_solved_python).length;
                const solvedJava = problems.filter(p => p.is_solved_java).length;
                const totalPythonSolves = problems.reduce((sum, p) => sum + (p.solve_count_python || 0), 0);
                const totalJavaSolves = problems.reduce((sum, p) => sum + (p.solve_count_java || 0), 0);
                const solvedAny = problems.filter(p => p.is_solved_python || p.is_solved_java).length;

                const pct = totalProblems > 0 ? Math.round(solvedAny / totalProblems * 100) : 0;

                // 다음 풀이 추천 문제 업데이트 (Continue Learning Card)
                updateContinueLearningCard(problems);

                statsDiv.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-weight:700; color:var(--color-text-primary); font-size:1.15rem;">${solvedAny} / ${totalProblems} 문제</span>
                        <span style="font-weight:700; color:var(--color-accent); font-size:0.95rem;">${pct}% 달성</span>
                    </div>
                    <div style="background-color:var(--color-bg-muted); border-radius:4px; height:8px; overflow:hidden; margin-bottom:14px;">
                        <div style="width:${pct}%; height:100%; background-color:var(--color-accent); transition:width 0.5s ease;"></div>
                    </div>
                    <div class="stat-grid-2">
                        <div class="stat-card">
                            <div class="stat-card-label">Python 풀이</div>
                            <div class="stat-card-value">${solvedPython} <span style="font-size:0.75rem; font-weight:normal; color:var(--color-text-muted);">(${totalPythonSolves}회)</span></div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-label">Java 풀이</div>
                            <div class="stat-card-value">${solvedJava} <span style="font-size:0.75rem; font-weight:normal; color:var(--color-text-muted);">(${totalJavaSolves}회)</span></div>
                        </div>
                    </div>
                `;
            } catch (e) {
                statsDiv.innerHTML = '<div class="state-error" style="font-size:0.85rem;">통계를 불러올 수 없습니다.</div>';
            }
        }

        // 이어서 학습하기 카드 동적 업데이트 함수
        function updateContinueLearningCard(problems) {
            const titleEl = document.getElementById('continue-action-title');
            const descEl = document.getElementById('continue-action-desc');
            const linkEl = document.getElementById('continue-action-link');
            if (!titleEl || !linkEl) return;

            // 현재 언어 기준 아직 안 푼 문제 중 가장 번호가 앞서는 문제 탐색
            const nextProblem = problems.find(p => {
                let dif = parseInt(p.difficulty);
                let isLocked = false;
                if (userRole !== 'admin' && dif !== 0) {
                    if (dif === 1 && !['level_3', 'level_2', 'level_1'].includes(userRole)) isLocked = true;
                    else if (dif === 3 && !['level_2', 'level_1'].includes(userRole)) isLocked = true;
                    else if (dif === 5 && userRole !== 'level_1') isLocked = true;
                }
                if (isLocked) return false;

                const isSolved = currentLangFilter === 'java' ? p.is_solved_java : p.is_solved_python;
                return !isSolved;
            });

            if (nextProblem) {
                titleEl.textContent = `[문제 ${nextProblem.display_id}] ${nextProblem.title}`;
                if (descEl) descEl.textContent = `${getDifficultyName(nextProblem.difficulty)} | 실시간 채점에 도전해보세요.`;
                linkEl.href = `judge.html?id=${nextProblem.id}`;
                linkEl.textContent = '이어서 풀기 \u2192';
            } else if (problems.length > 0) {
                titleEl.textContent = '모든 도전 가능 문제를 완료했습니다!';
                if (descEl) descEl.textContent = '자료실에서 심화 학습을 진행하거나 복습해보세요.';
                linkEl.href = `materials.html`;
                linkEl.textContent = '학습 자료실 가기 \u2192';
            }
        }

        // 월간 점수 조회
        async function fetchMonthlyScores() {
            const scoreDiv = document.getElementById('monthly-score-content');
            try {
                const res = await fetch(`${API_BASE_URL}/monthly-scores?user_id=${userId}`);
                const data = await res.json();
                const scores = data.monthly_scores || [];

                if (scores.length === 0) {
                    scoreDiv.innerHTML = '<div style="text-align:center; color:var(--color-text-muted); font-size:0.85rem; padding:12px;">기록된 월간 점수가 없습니다.</div>';
                    return;
                }

                const totalScore = scores.reduce((sum, s) => sum + s.score, 0);

                let html = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--color-border-subtle);">
                        <span style="font-size:0.85rem; color:var(--color-text-muted);">최근 3개월 누적</span>
                        <span style="font-size:1.1rem; font-weight:700; color:var(--color-accent);">${totalScore}점</span>
                    </div>
                `;

                scores.forEach(s => {
                    const [year, month] = s.month.split('-');
                    const displayMonth = `${year}년 ${parseInt(month)}월`;
                    const maxBar = Math.max(totalScore, 30);
                    const barPct = Math.min(Math.round(s.score / maxBar * 100), 100);

                    html += `
                        <div style="margin-bottom:10px;">
                            <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:4px;">
                                <span style="font-weight:600; color:var(--color-text-secondary);">${displayMonth}</span>
                                <span style="font-weight:700; color:var(--color-text-primary);">${s.score}점 <span style="font-size:0.75rem; font-weight:normal; color:var(--color-text-muted);">(${s.problem_count}문제)</span></span>
                            </div>
                            <div style="background-color:var(--color-bg-muted); border-radius:3px; height:6px; overflow:hidden;">
                                <div style="width:${barPct}%; height:100%; background-color:var(--color-accent);"></div>
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div style="margin-top:12px; padding-top:8px; border-top:1px solid var(--color-border-subtle); font-size:0.75rem; color:var(--color-text-muted); line-height:1.5;">
                        점수 기준: 기초/3급 1점, 2급 2점, 1급 3점
                    </div>
                `;

                scoreDiv.innerHTML = html;
            } catch (e) {
                scoreDiv.innerHTML = '<div class="state-error" style="font-size:0.85rem;">점수를 불러올 수 없습니다.</div>';
            }
        }

        // 문제 목록 조회
        async function fetchProblems() {
            const container = document.getElementById('problem-list-container');
            const paginationContainer = document.getElementById('pagination-container');

            try {
                const response = await fetch(`${API_BASE_URL}/problems?user_id=${userId}`);
                if (!response.ok) throw new Error("서버 연동 실패: " + response.statusText);

                const data = await response.json();

                const filteredProblems = data.problems.filter(p => {
                    if (p.supported_languages && !p.supported_languages.includes(currentLangFilter)) {
                        return false;
                    }

                    if (currentDiffFilter !== 'all' && String(p.difficulty) !== currentDiffFilter) return false;

                    if (currentSolveFilter === 'solved') {
                        if (currentLangFilter === 'python3' && !p.is_solved_python) return false;
                        if (currentLangFilter === 'java' && !p.is_solved_java) return false;
                    } else if (currentSolveFilter === 'unsolved') {
                        if (currentLangFilter === 'python3' && p.is_solved_python) return false;
                        if (currentLangFilter === 'java' && p.is_solved_java) return false;
                    }

                    return true;
                });

                if (filteredProblems.length === 0) {
                    container.innerHTML = '<div class="state-box">선택한 조건에 해당하는 문제가 없습니다.</div>';
                    paginationContainer.innerHTML = '';
                    return;
                }

                const totalPages = Math.ceil(filteredProblems.length / ITEMS_PER_PAGE);
                if (currentPage > totalPages) currentPage = totalPages;
                const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
                const pageProblems = filteredProblems.slice(startIndex, startIndex + ITEMS_PER_PAGE);

                container.innerHTML = '';

                pageProblems.forEach(p => {
                    let isLocked = true;
                    let dif = parseInt(p.difficulty);

                    if (userRole === 'admin' || dif === 0) {
                        isLocked = false;
                    } else if (dif === 1) {
                        if (['level_3', 'level_2', 'level_1'].includes(userRole)) isLocked = false;
                    } else if (dif === 3) {
                        if (['level_2', 'level_1'].includes(userRole)) isLocked = false;
                    } else if (dif === 5) {
                        if (userRole === 'level_1') isLocked = false;
                    }

                    const makeBadge = (text, ...classes) => {
                        const badge = document.createElement('span');
                        badge.classList.add('badge', ...classes);
                        badge.textContent = text;
                        return badge;
                    };
                    const card = document.createElement('a');
                    card.href = isLocked ? '#' : `judge.html?id=${encodeURIComponent(p.id)}`;
                    card.className = 'problem-card';
                    if (isLocked) card.style.cssText = 'opacity:0.6; cursor:not-allowed; pointer-events:none;';

                    const info = document.createElement('div');
                    info.className = 'problem-info';
                    const title = document.createElement('h3');
                    title.textContent = `[문제 ${p.display_id}] ${p.title}`;
                    const tags = document.createElement('div');
                    tags.className = 'problem-tags';
                    tags.append(makeBadge(getDifficultyName(dif), `badge-diff-${dif}`));
                    tags.append(makeBadge(
                        p.problem_type === 'blank' ? '빈칸 채우기' : p.problem_type === 'debugging' ? '디버깅' : '코드 작성',
                        ...(p.problem_type === 'blank' ? ['badge-warning'] : p.problem_type === 'debugging' ? ['badge-danger'] : [])
                    ));
                    tags.append(makeBadge(isLocked ? '잠김 (승급 필요)' : '도전 가능', isLocked ? 'badge-danger' : 'badge-success'));
                    if (p.is_solved_python) tags.append(makeBadge(`Python 해결 (${p.solve_count_python}회)`, 'badge-solved'));
                    if (p.is_solved_java) tags.append(makeBadge(`Java 해결 (${p.solve_count_java}회)`, 'badge-solved'));
                    if (p.view_answer_count > 0) tags.append(makeBadge(`답안 열람 (${p.view_answer_count}회)`, 'badge-danger'));
                    info.append(title, tags);
                    card.append(info);

                    if (isLocked) {
                        const button = document.createElement('button');
                        button.className = 'solve-btn';
                        button.disabled = true;
                        button.textContent = '잠김';
                        card.append(button);
                    } else {
                        const action = document.createElement('span');
                        action.className = 'solve-btn';
                        action.textContent = '풀이 시작 →';
                        card.append(action);
                    }
                    container.append(card);
                });

                renderPagination(totalPages);

            } catch (error) {
                container.innerHTML = `<div class="state-error">
                    <strong>문제 목록을 불러올 수 없습니다.</strong><br>
                    백엔드 서버와 통신 중 문제가 발생했습니다. (${error.message})
                </div>`;
            }
        }

        // 페이지네이션 렌더링
        function renderPagination(totalPages) {
            const container = document.getElementById('pagination-container');
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = '';
            html += `<button type="button" class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''} aria-label="이전 페이지">&larr; 이전</button>`;

            for (let i = 1; i <= totalPages; i++) {
                html += `<button type="button" class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})" aria-label="${i} 페이지">${i}</button>`;
            }

            html += `<button type="button" class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''} aria-label="다음 페이지">다음 &rarr;</button>`;
            container.innerHTML = html;
        }

        function goToPage(page) {
            if (page < 1) return;
            currentPage = page;
            fetchProblems();
        }

        // 랭킹 조회
        async function fetchRanking() {
            const container = document.getElementById('ranking-container');
            try {
                const response = await fetch(`${API_BASE_URL}/ranking`);
                if (!response.ok) throw new Error("랭킹 서버 연동 실패");

                const data = await response.json();
                container.innerHTML = '';

                if (!data.ranking || data.ranking.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:var(--color-text-muted); padding:16px; font-size:0.85rem;">아직 기록된 랭킹 데이터가 없습니다.</div>';
                    return;
                }

                data.ranking.forEach((r, idx) => {
                    const item = document.createElement('li');
                    item.className = 'ranking-item';
                    const rank = document.createElement('span');
                    rank.className = 'rank-number';
                    if (idx < 3) rank.classList.add('top-rank');
                    rank.textContent = String(idx + 1);
                    const nickname = document.createElement('span');
                    nickname.className = 'rank-nickname';
                    nickname.textContent = r.nickname || '';
                    if (r.role === 'admin') {
                        const role = document.createElement('span');
                        role.style.cssText = 'font-size:0.75rem; font-weight:normal; color:var(--color-text-muted);';
                        role.textContent = ' (Admin)';
                        nickname.append(role);
                    }
                    const score = document.createElement('span');
                    score.className = 'rank-score';
                    score.textContent = `${r.solved_count || 0}문제`;
                    item.append(rank, nickname, score);
                    container.append(item);
                });

            } catch (error) {
                container.innerHTML = `<div class="state-error" style="font-size:0.8rem; padding:8px;">랭킹 조회 오류</div>`;
            }
        }
    </script>
</body>

</html>
