        /* 딥 스페이스 배경 */

        /* 별무리 캔버스 */

    <!-- 🌌 스타필드 파티클 엔진 & 컴팩트 UI 스크립트 -->
    <script>
        // 1. 별무리 캔버스
        const canvas = document.getElementById('starfield-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        const STAR_COUNT = 240;
        let stars = [];
        let mouse = { x: width / 2, y: height / 2, moved: false };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.moved = true;
        });

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.8 + 0.3;
                this.speed = Math.random() * 0.25 + 0.05;
                this.baseAlpha = Math.random() * 0.7 + 0.2;
                this.alpha = this.baseAlpha;
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.twinkleDir = 1;
                const colors = ['#ffffff', '#ecfdf5', '#d1fae5', '#a7f3d0', '#67e8f9'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y -= this.speed;
                if (this.y < 0) this.y = height;
                this.alpha += this.twinkleSpeed * this.twinkleDir;
                if (this.alpha > 0.95) this.twinkleDir = -1;
                if (this.alpha < 0.15) this.twinkleDir = 1;
                if (mouse.moved) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 90) {
                        const force = (90 - dist) / 90;
                        this.x -= (dx / dist) * force * 1.5;
                        this.y -= (dy / dist) * force * 1.5;
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height * 0.4);
                this.length = Math.random() * 80 + 40;
                this.speed = Math.random() * 8 + 6;
                this.angle = Math.PI / 4;
                this.active = false;
                this.alpha = 0;
            }
            spawn() { this.reset(); this.active = true; this.alpha = 1; }
            update() {
                if (!this.active) return;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.alpha -= 0.015;
                if (this.alpha <= 0 || this.x > width || this.y > height) this.active = false;
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.strokeStyle = `rgba(167, 243, 208, ${this.alpha})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - Math.cos(this.angle) * this.length, this.y - Math.sin(this.angle) * this.length);
                ctx.stroke();
                ctx.restore();
            }
        }

        let shootingStars = [new ShootingStar(), new ShootingStar()];
        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());
        }
        initStars();

        setInterval(() => {
            const dormant = shootingStars.find(s => !s.active);
            if (dormant) dormant.spawn();
        }, 5000);

        function animateStarfield() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(s => { s.update(); s.draw(); });
            shootingStars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animateStarfield);
        }
        animateStarfield();

                    card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
                });
            });
        }

            {

                    || item.summary.toLowerCase().includes(q) 
                    || item.tags.some(t => t.toLowerCase().includes(q));

                return matchCat && matchQuery;
            });

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.neon-pill').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderAssets();
        }

        function handleSearch(val) {
            searchQuery = val.trim();
            const clearBtn = document.getElementById('search-clear-btn');
            if (clearBtn) {
                if (val.length > 0) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }
            renderAssets();
        }

        function clearSearch() {
            const input = document.getElementById('asset-search');
            if (input) {
                input.value = '';
                handleSearch('');
                input.focus();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const searchInput = document.getElementById('asset-search');
                if (searchInput && (document.activeElement === searchInput || searchInput.value)) {
                    clearSearch();
                }
            }
        });
