    <script>
        // 1. 별무리 캔버스
        const canvas = document.getElementById('starfield-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        const STAR_COUNT = 240;
        let stars = [];
        let mouse = { x: width / 2, y: height / 2, moved: false };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.moved = true;
        });

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.8 + 0.3;
                this.speed = Math.random() * 0.25 + 0.05;
                this.baseAlpha = Math.random() * 0.7 + 0.2;
                this.alpha = this.baseAlpha;
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.twinkleDir = 1;
                const colors = ['#ffffff', '#e0e7ff', '#c7d2fe', '#a5b4fc', '#67e8f9'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y -= this.speed;
                if (this.y < 0) this.y = height;
                this.alpha += this.twinkleSpeed * this.twinkleDir;
                if (this.alpha > 0.95) this.twinkleDir = -1;
                if (this.alpha < 0.15) this.twinkleDir = 1;
                if (mouse.moved) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 90) {
                        const force = (90 - dist) / 90;
                        this.x -= (dx / dist) * force * 1.5;
                        this.y -= (dy / dist) * force * 1.5;
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height * 0.4);
                this.length = Math.random() * 80 + 40;
                this.speed = Math.random() * 8 + 6;
                this.angle = Math.PI / 4;
                this.active = false;
                this.alpha = 0;
            }
            spawn() { this.reset(); this.active = true; this.alpha = 1; }
            update() {
                if (!this.active) return;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.alpha -= 0.015;
                if (this.alpha <= 0 || this.x > width || this.y > height) this.active = false;
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - Math.cos(this.angle) * this.length, this.y - Math.sin(this.angle) * this.length);
                ctx.stroke();
                ctx.restore();
            }
        }

        let shootingStars = [new ShootingStar(), new ShootingStar()];
        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());
        }
        initStars();

        setInterval(() => {
            const dormant = shootingStars.find(s => !s.active);
            if (dormant) dormant.spawn();
        }, 5000);

        function animateStarfield() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(s => { s.update(); s.draw(); });
            shootingStars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animateStarfield);
        }
        animateStarfield();

        // 2. 카드 스포트라이트
        function initCardSpotlight() {
            document.querySelectorAll('.universe-compact-card').forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                    card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
                });
            });
        }

        // 3. 데이터 로딩 및 렌더링
        let toolsData = [];
        let currentHub = 'all';
        let searchQuery = '';
        let viewMode = 'card'; // 'card' | 'list'

        // JSON 데이터 비동기 로드
        async function loadTools() {
            try {
                const res = await fetch('./data/tools.json');
                if (!res.ok) throw new Error('Failed to load tools.json');
                toolsData = await res.json();
                
                // 허브별 카운터 및 히어로 통계 동적 갱신
                const totalLen = toolsData.length;
                document.getElementById('total-count').textContent = totalLen;
                document.getElementById('header-count').textContent = totalLen;
                const badgeEl = document.getElementById('hero-badge-count');
                if (badgeEl) badgeEl.textContent = totalLen;
                const heroTotalEl = document.getElementById('hero-total-count');
                if (heroTotalEl) heroTotalEl.textContent = totalLen;
                
                const agentCount = toolsData.filter(t => t.hub === 'agent').length;
                const mcpCount = toolsData.filter(t => t.hub === 'mcp').length;
                const skillCount = toolsData.filter(t => t.hub === 'skill').length;
                const pluginCount = toolsData.filter(t => t.hub === 'plugin').length;
                const promptCount = toolsData.filter(t => t.hub === 'prompt').length;
                const localCount = toolsData.filter(t => t.isLocal).length;

                document.getElementById('count-agent').textContent = agentCount;
                document.getElementById('count-mcp').textContent = mcpCount;
                document.getElementById('count-skill').textContent = skillCount;
                document.getElementById('count-plugin').textContent = pluginCount;
                document.getElementById('count-prompt').textContent = promptCount;
                document.getElementById('count-local').textContent = localCount;

                document.getElementById('loading-state').classList.add('hidden');
                renderTools();
            } catch (err) {
                console.error(err);
                document.getElementById('loading-state').innerHTML = `
                    <p class="text-rose-400 font-bold">도구 데이터를 불러오지 못했습니다.</p>
                `;
            }
        }
        loadTools();

        function setViewMode(mode) {
            viewMode = mode;
            const cardBtn = document.getElementById('view-card-btn');
            const listBtn = document.getElementById('view-list-btn');

            if (mode === 'card') {
                cardBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-indigo-600 text-white transition-all shadow-sm';
                listBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-slate-400 hover:text-white transition-all';
            } else {
                listBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-indigo-600 text-white transition-all shadow-sm';
                cardBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 text-slate-400 hover:text-white transition-all';
            }
            renderTools();
        }

        function renderTools() {
            const grid = document.getElementById('tools-grid');
            const list = document.getElementById('tools-list');
            const emptyState = document.getElementById('empty-state');

            const filtered = toolsData.filter(tool => {
                const matchHub = (currentHub === 'all') 
                    ? true 
                    : (currentHub === 'local' ? tool.isLocal : tool.hub === currentHub);
                
                const q = searchQuery.toLowerCase();
                const matchQuery = !q 
                    || tool.title.toLowerCase().includes(q) 
                    || tool.summary.toLowerCase().includes(q) 
                    || tool.tags.some(t => t.toLowerCase().includes(q));

                return matchHub && matchQuery;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                list.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            if (viewMode === 'card') {
                list.classList.add('hidden');
                grid.classList.remove('hidden');
                
                // 4열 컴팩트 미니 글래스 카드 (높이 대폭 축소)
                grid.innerHTML = filtered.map(tool => `
                    <div class="universe-compact-card p-4 min-h-[140px] cursor-pointer"
                         onclick="openModal('${tool.id}')">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-[10px] font-mono px-2 py-0.5 rounded-full font-semibold border ${tool.badgeClass}">
                                    ${tool.hubName}
                                </span>
                                <span class="text-[11px] text-slate-400 font-medium truncate max-w-[110px]">
                                    ${tool.cost}
                                </span>
                            </div>
                            <h3 class="text-sm font-bold text-white mb-1.5 tracking-tight truncate group-hover:text-indigo-300 transition-colors" title="${tool.title}">
                                ${tool.title}
                            </h3>
                            <p class="text-slate-300/75 text-xs leading-relaxed line-clamp-2 mb-3">
                                ${tool.summaryShort || tool.summary}
                            </p>
                        </div>
                        <div class="pt-2 border-t border-white/5 flex items-center justify-between">
                            <div class="flex items-center gap-1 overflow-hidden">
                                ${(tool.tags || []).slice(0, 2).map(t => `
                                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-white/5 text-slate-300 truncate">#${t}</span>
                                `).join('')}
                            </div>
                            <span class="text-[11px] font-semibold text-indigo-400 hover:text-indigo-300 flex items-center gap-0.5 flex-shrink-0">
                                <span>가이드</span>
                                <i data-lucide="chevron-right" class="w-3 h-3"></i>
                            </span>
                        </div>
                    </div>
                `).join('');
                
                initCardSpotlight();
            } else {
                grid.classList.add('hidden');
                list.classList.remove('hidden');

                // 슬림 리스트 뷰 (초슬림 테이블 행 형태)
                list.innerHTML = filtered.map(tool => `
                    <div class="universe-compact-card p-3 px-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 cursor-pointer hover:border-indigo-400"
                         onclick="openModal('${tool.id}')">
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <span class="text-[10px] font-mono px-2 py-0.5 rounded-full font-semibold border ${tool.badgeClass} flex-shrink-0">
                                ${tool.hubName}
                            </span>
                            <div class="min-w-0 flex-1">
                                <h4 class="text-sm font-bold text-white truncate">${tool.title}</h4>
                                <p class="text-xs text-slate-400 truncate">${tool.summary}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 justify-between sm:justify-end flex-shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-white/5">
                            <span class="text-xs text-slate-400 font-medium">${tool.cost}</span>
                            <div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
                                <button onclick="openModal('${tool.id}')" class="px-2.5 py-1 rounded-md bg-white/5 hover:bg-white/10 text-xs text-indigo-300 font-semibold transition-colors">
                                    상세보기
                                </button>
                                <a href="${tool.officialUrl}" target="_blank" rel="noopener noreferrer" 
                                   class="p-1 rounded-md bg-indigo-600/80 hover:bg-indigo-500 text-white transition-colors" title="공식 링크">
                                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            lucide.createIcons();
        }

        function filterHub(hub) {
            currentHub = hub;
            document.querySelectorAll('.neon-pill').forEach(btn => {
                if (btn.getAttribute('data-hub') === hub) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderTools();
        }

        function handleSearch(val) {
            searchQuery = val.trim();
            const clearBtn = document.getElementById('search-clear-btn');
            if (clearBtn) {
                if (val.length > 0) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }
            renderTools();
        }

        function clearSearch() {
            const input = document.getElementById('tool-search');
            if (input) {
                input.value = '';
                handleSearch('');
                input.focus();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const searchInput = document.getElementById('tool-search');
                if (searchInput && (document.activeElement === searchInput || searchInput.value)) {
                    clearSearch();
                } else {
                    closeModal();
                }
            }
        });

        // 대형 모달 팝업 열기 (옵시디언 마크다운 전체 렌더링)
        function openModal(id) {
            const tool = toolsData.find(t => t.id === id);
            if (!tool) return;

            const modal = document.getElementById('tool-modal');
            const header = document.getElementById('modal-header');
            const markdownContainer = document.getElementById('modal-markdown-content');
            const footerActions = document.getElementById('modal-footer-actions');

            // 헤더 정보
            header.innerHTML = `
                <div class="flex flex-wrap items-center gap-2 mb-2">
                    <span class="text-xs font-mono px-2.5 py-0.5 rounded-full font-semibold border ${tool.badgeClass}">
                        ${tool.hubName}
                    </span>
                    <span class="text-xs text-slate-400 font-medium">${tool.cost}</span>
                    ${tool.isLocal ? '<span class="text-xs px-2 py-0.5 rounded-full bg-teal-500/15 text-teal-300 border border-teal-500/30 font-semibold">100% 로컬·오프라인</span>' : ''}
                </div>
                <h2 class="text-xl sm:text-2xl font-black text-white tracking-tight">${tool.title}</h2>
            `;

            // 본문: marked.js로 옵시디언 마크다운 전체를 파싱하여 주입
            try {
                markdownContainer.innerHTML = marked.parse(tool.content || tool.summary);
            } catch (err) {
                markdownContainer.innerHTML = `<p class="text-slate-300">${tool.summary}</p>`;
            }

            // 푸터 버튼
            footerActions.innerHTML = `
                <a href="${tool.officialUrl}" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs transition-all shadow-[0_0_15px_rgba(99,102,241,0.4)]">
                    <span>공식 사이트 / 저장소 방문</span>
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </a>
            `;

            modal.classList.remove('hidden');
            // 모달 열릴 때 상단으로 스크롤 초기화
            document.getElementById('modal-body').scrollTop = 0;
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('tool-modal').classList.add('hidden');
        }

        document.getElementById('tool-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
