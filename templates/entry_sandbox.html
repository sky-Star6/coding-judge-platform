    <style>
        /* EntryTool 위젯 드롭다운 팝업 레이아웃 및 z-index 최상위 보장 */
        .entry-widget-dropdown {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 0 !important;
            height: 0 !important;
            overflow: visible !important;
            z-index: 1000 !important;
        }

        /* 브라우저 기본 리스트 불릿 점만 제거 (엔트리 고유 패딩 및 레이아웃 100% 보존) */
        ul, ol, li {
            list-style: none !important;
            list-style-type: none !important;
        }
        li::marker {
            display: none !important;
        }

        /* 엔트리 카테고리 탭 원래 높이 및 패딩(아이콘 상단 34px 여백) 완벽 복원 및 상단/좌측 불필요 여백 완전 제거 */
        .entryCategoryListWorkspace,
        .entryCategoryListWorkspace ul,
        .entryCategoryListWorkspace .entryCategoryList {
            margin: 0 !important;
            padding: 0 !important;
            list-style: none !important;
            list-style-type: none !important;
        }

        .entryCategoryListWorkspace .visiblePoint {
            height: 0 !important;
            min-height: 0 !important;
            max-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            font-size: 0 !important;
            line-height: 0 !important;
            border: none !important;
            overflow: hidden !important;
        }

        .entryCategoryElementWorkspace {
            padding: 34px 0 4px !important;
            min-width: 58px !important;
            margin: 0 !important;
            text-align: center !important;
            font-size: 12px !important;
            line-height: normal !important;
            box-sizing: content-box !important;
        }
    </style>
</head>
<body class="entry-page-body">

    <!-- 상단 컨트롤 바 헤더 -->
    <header class="sandbox-header-bar">
        <div class="sandbox-header-left">
            <div class="sandbox-header-title">엔트리 자유 코딩 샌드박스</div>
            <div class="sandbox-title-container">
                <input type="text" id="project-title-input" class="sandbox-title-input" value="무제 작품" placeholder="작품 이름을 입력하세요" title="작품 이름 변경" onchange="onProjectNameChange(this.value)" />
                <span id="save-badge" class="sandbox-save-badge">새 작품</span>
            </div>
        </div>
        <div class="sandbox-header-controls">
            <button class="sandbox-btn" onclick="createNewProject()" title="새로운 빈 프로젝트 시작">새 작품</button>
            <button class="sandbox-btn sandbox-btn-save" onclick="saveProject()" title="현재 작품 저장 (Ctrl+S)">💾 저장하기</button>
            <button class="sandbox-btn sandbox-btn-save-as" onclick="saveProjectAs()" title="백업용 새 복사본으로 저장 (Ctrl+Shift+S)">📑 다른 이름으로 저장</button>
            <button class="sandbox-btn" onclick="exportProjectToPC()" title="내 컴퓨터에 .ent 백업 파일 다운로드">💻 PC 백업</button>
            <button class="sandbox-btn" onclick="showLoadModal()" title="저장된 작품 불러오기">📂 불러오기</button>
            <button class="sandbox-btn" style="background-color: #f26522; border-color: #ea580c;" onclick="location.href='/home.html'">메인으로</button>
        </div>
    </header>

    <!-- 숨김 파일 입력 (내 컴퓨터에서 백업 파일 .ent/.json 열기용) -->
    <input type="file" id="pc-backup-file-input" accept=".ent,.json" style="display: none;" onchange="handlePCFileOpen(event)" />

    <!-- 엔트리 엔진이 렌더링될 메인 캔버스 컨테이너 -->
    <div class="sandbox-container">
        <div id="entry-workspace-target"></div>
    </div>

    <!-- 작품 불러오기 모달 창 -->
    <div id="load-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: #fff; padding: 24px; border-radius: 10px; width: 500px; max-height: 80vh; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.25);">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1a62b8; padding-bottom: 12px;">
                <h3 style="margin: 0; color: #1e293b; font-size: 1.15rem; font-weight: 700;">내 작품 불러오기 / 백업 관리</h3>
                <button class="cos-btn cos-btn-secondary" style="font-size: 0.82rem; padding: 4px 10px;" onclick="document.getElementById('pc-backup-file-input').click()">💻 PC 파일 열기</button>
            </div>
            <div id="project-list-container" style="overflow-y: auto; flex-grow: 1; max-height: 380px; display: flex; flex-direction: column; gap: 8px;">
                <!-- 로딩 중 또는 저장 목록이 스크립트에 의해 동적으로 렌더링됩니다 -->
                <p style="text-align: center; color: #666; padding: 20px;">작품 목록을 불러오는 중...</p>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #e2e8f0; padding-top: 12px;">
                <button class="cos-btn cos-btn-secondary" onclick="closeLoadModal()">닫기</button>
            </div>
        </div>
    </div>

    <!-- 1. 외부 의존성 라이브러리 로드 -->
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular-route.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

    <!-- 2. 엔트리 유틸리티 및 정적 설정 (EntryStatic 포함) -->
    <script src="/lib/entryjs/extern/util/filbert.js"></script>
    <script src="/lib/entryjs/extern/util/CanvasInput.js"></script>
    <script src="/lib/entryjs/extern/util/ndgmr.Collision.js"></script>
    <script src="/lib/entryjs/extern/util/handle.js"></script>
    <script src="/lib/entryjs/extern/util/bignumber.min.js"></script>
    <script src="/lib/entryjs/extern/util/static.js"></script>

    <!-- 3. EntryTool 및 공식 그림판(EntryPaint) 로드 -->
    <script src="{{ url_for('static', filename='js/entry-tool.js') }}"></script>
    <script src="{{ url_for('static', filename='js/entry-paint.js') }}"></script>
    <script>
        if (window.EntryPaint && window.EntryPaint.default && !window.EntryPaint.create) {
            window.EntryPaint.create = function(options) {
                return window.EntryPaint.default.create(options);
            };
        }
        window.EntryVideoLegacy = function() {};
        EntryVideoLegacy.prototype = {
            init: function() {}, turnOnWebcam: function() {}, turnOffWebcam: function() {},
            setOptions: function() {}, getFrame: function() { return null; }, destroy: function() {}
        };
        window.EntrySoundEditor = {
            renderSoundEditor: function() {}, registExportFunction: function() {}, unregistExportFunction: function() {},
            loadSoundByUrl: function() { return Promise.resolve(); }, loadSound: function() {}, isModified: function() { return false; },
            clearSound: function() {}, clearHistory: function() {}, getAudioBuffer: function() { return Promise.resolve(null); }, destroy: function() {}
        };
    </script>

    <!-- 4. 엔트리 엔진 코어 라이브러리 로드 -->
    <script src="/lib/entryjs/dist/entry.js"></script>
    <script src="{{ url_for('static', filename='js/entry_resource_manager.js') }}"></script>

    <!-- 엔트리 엔진 초기화 및 API 제어 자바스크립트 -->
    <script>
        // 전역 엔트리 설정 객체
        var entryWorkspace = null;

        // 문서가 로드되면 엔트리 에디터를 초기화합니다.
        document.addEventListener("DOMContentLoaded", function() {
            initEntryWorkspace();
        });

        /**
         * 엔트리 에디터를 대상 DOM 요소에 초기화하는 함수입니다.
         */
        function initEntryWorkspace() {
            var container = document.getElementById('entry-workspace-target');
            
            // 엔트리 캔버스 크기를 컨테이너 크기와 동기화
            container.style.width = '100%';
            container.style.height = '100%';

            // 엔트리 초기화 설정
            Entry.init(container, {
                type: 'workspace', // 전체 작업 공간 모드 설정
                textCodingEnable: true, // 파이썬/블록 전환 기능 활성화
                libDir: '',
                entryDir: '/lib/entryjs'
            });
            Entry.mediaFilePath = '/lib/entryjs/images/';

            // 빈 프로젝트 템플릿 로드 (기본 엔트리봇 캐릭터 1개 배치)
            setTimeout(function() {
                window.dispatchEvent(new Event('resize'));
                Entry.loadProject();
                if (window.registerEntryEvents) {
                    window.registerEntryEvents();
                }
                if (window.syncEntryBlockCount) {
                    window.syncEntryBlockCount();
                }
            }, 300);
        }

        // 전역 작품 상태 변수
        var currentProjectId = null;
        var currentProjectName = "무제 작품";

        function updateSaveBadge(status, text) {
            var badge = document.getElementById('save-badge');
            if (!badge) return;
            badge.className = 'sandbox-save-badge ' + (status || '');
            badge.textContent = text || '새 작품';
        }

        function onProjectNameChange(val) {
            currentProjectName = (val || '').trim() || '무제 작품';
            var titleInput = document.getElementById('project-title-input');
            if (titleInput) titleInput.value = currentProjectName;
            updateSaveBadge('modified', '수정됨');
        }

        function getFormattedBackupSuffix() {
            var now = new Date();
            var mm = String(now.getMonth() + 1).padStart(2, '0');
            var dd = String(now.getDate()).padStart(2, '0');
            var hh = String(now.getHours()).padStart(2, '0');
            var min = String(now.getMinutes()).padStart(2, '0');
            return mm + dd + '_' + hh + min;
        }

        /**
         * 새 작품 만들기 기능
         * 경고창 확인 후 에디터를 공백 상태로 리셋합니다.
         */
        function createNewProject() {
            if (confirm("새 작품을 만드시겠습니까? 저장되지 않은 변경사항은 사라집니다.")) {
                currentProjectId = null;
                currentProjectName = "무제 작품";
                var titleInput = document.getElementById('project-title-input');
                if (titleInput) titleInput.value = currentProjectName;
                updateSaveBadge('', '새 작품');
                Entry.clearProject();
                Entry.loadProject(); // 기본 템플릿 재구성
                if (window.syncEntryBlockCount) {
                    setTimeout(window.syncEntryBlockCount, 100);
                }
            }
        }

        /**
         * 작품 저장 기능 (현재 작품에 덮어쓰기 업데이트 또는 첫 저장)
         */
        function saveProject() {
            var titleInput = document.getElementById('project-title-input');
            var projName = titleInput ? titleInput.value.trim() : currentProjectName;
            if (!projName) projName = "무제 작품";
            currentProjectName = projName;

            // 처음 저장하는 경우 이름 확인 프롬프트
            if (!currentProjectId) {
                var inputName = prompt("저장할 작품의 이름을 입력하세요:", currentProjectName);
                if (inputName === null) return; // 사용자가 취소
                if (inputName.trim()) {
                    currentProjectName = inputName.trim();
                    if (titleInput) titleInput.value = currentProjectName;
                }
            }

            var projectData = Entry.exportProject();
            var payload = {
                project_id: currentProjectId,
                project_name: currentProjectName,
                project_type: 'sandbox',
                is_save_as: false,
                project_data: JSON.stringify(projectData)
            };

            fetch('/api/entry/projects/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    currentProjectId = data.project_id;
                    currentProjectName = data.project_name || currentProjectName;
                    if (titleInput) titleInput.value = currentProjectName;

                    var now = new Date();
                    var timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
                    updateSaveBadge('saved', '저장됨 ' + timeStr);
                    alert("성공적으로 저장되었습니다! (" + currentProjectName + ")");
                } else {
                    alert("저장 실패: " + data.message);
                }
            })
            .catch(function(err) {
                console.error("저장 에러:", err);
                alert("서버 연결에 실패하여 저장할 수 없습니다.");
            });
        }

        /**
         * 다른 이름으로 저장 기능 (백업 생성)
         * 원본은 그대로 보존하고 새 이름으로 복제본을 DB에 등록합니다.
         */
        function saveProjectAs() {
            var baseName = currentProjectName || "작품";
            // 기본 추천 이름: [현재이름]_백업_MMDD_HHmm
            var defaultBackupName = baseName.replace(/_백업.*$/, '') + "_백업_" + getFormattedBackupSuffix();

            var newName = prompt("다른 이름으로 저장할 작품(백업) 이름을 입력하세요:", defaultBackupName);
            if (newName === null) return; // 취소
            newName = newName.trim();
            if (!newName) {
                alert("작품 이름을 입력해야 합니다.");
                return;
            }

            var projectData = Entry.exportProject();
            var payload = {
                project_id: null, // 신규 등록하여 독립적인 백업본 생성
                project_name: newName,
                project_type: 'sandbox',
                is_save_as: true,
                project_data: JSON.stringify(projectData)
            };

            fetch('/api/entry/projects/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    currentProjectId = data.project_id;
                    currentProjectName = data.project_name || newName;
                    var titleInput = document.getElementById('project-title-input');
                    if (titleInput) titleInput.value = currentProjectName;

                    updateSaveBadge('backup', '백업 저장됨');
                    alert("새로운 백업 작품 [" + currentProjectName + "] (으)로 안전하게 저장되었습니다!");
                } else {
                    alert("백업 저장 실패: " + data.message);
                }
            })
            .catch(function(err) {
                console.error("백업 저장 에러:", err);
                alert("서버 연결에 실패하여 저장할 수 없습니다.");
            });
        }

        /**
         * POSIX ustar TAR 아카이브 생성 유틸리티 (.ent 공식 규격 호환)
         * 엔트리 공식 프로그램 및 playentry.org 웹사이트와 100% 호환되는 아카이브 생성
         */
        function createTarArchive(files) {
            var blocks = [];
            var encoder = new TextEncoder();

            function writeString(buf, offset, str, maxLen) {
                var bytes = encoder.encode(str);
                for (var i = 0; i < maxLen && i < bytes.length; i++) {
                    buf[offset + i] = bytes[i];
                }
            }

            function writeOctal(buf, offset, num, len) {
                var str = num.toString(8);
                while (str.length < len - 1) str = '0' + str;
                str = str + ' ';
                writeString(buf, offset, str, len);
            }

            files.forEach(function(file) {
                var fileBytes = (typeof file.data === 'string') ? encoder.encode(file.data) : file.data;
                var header = new Uint8Array(512);

                // 1. 파일명 (100바이트)
                writeString(header, 0, file.name, 100);
                // 2. 모드 (8바이트)
                writeString(header, 100, '0000644\0', 8);
                // 3. uid, gid (각 8바이트)
                writeString(header, 108, '0000000\0', 8);
                writeString(header, 116, '0000000\0', 8);
                // 4. 파일 크기 (12바이트 8진수)
                writeOctal(header, 124, fileBytes.length, 12);
                // 5. 수정 시각 (12바이트 8진수)
                writeOctal(header, 136, Math.floor(Date.now() / 1000), 12);
                // 6. 타입 플래그 ('0': 일반 파일)
                header[156] = 48;
                // 7. 매직 넘버 ("ustar\0") 및 버전 ("00")
                writeString(header, 257, 'ustar\0', 6);
                header[263] = 48;
                header[264] = 48;

                // 8. 체크섬 계산
                for (var i = 0; i < 8; i++) header[148 + i] = 32; // 공백으로 초기화
                var sum = 0;
                for (var j = 0; j < 512; j++) sum += header[j];
                var chkStr = sum.toString(8);
                while (chkStr.length < 6) chkStr = '0' + chkStr;
                writeString(header, 148, chkStr + '\0 ', 8);

                blocks.push(header);
                blocks.push(fileBytes);

                // 512바이트 패딩 블록 맞춤
                var remainder = fileBytes.length % 512;
                if (remainder !== 0) {
                    blocks.push(new Uint8Array(512 - remainder));
                }
            });

            // TAR 아카이브 종료 마커: 1024바이트 0
            blocks.push(new Uint8Array(1024));

            var totalLen = 0;
            blocks.forEach(function(b) { totalLen += b.length; });
            var tarBuf = new Uint8Array(totalLen);
            var offset = 0;
            blocks.forEach(function(b) {
                tarBuf.set(b, offset);
                offset += b.length;
            });

            return tarBuf;
        }

        /**
         * .ent(TAR 아카이브) 또는 .json 파일에서 project.json 데이터 파싱
         */
        function parseProjectFromTarOrJson(arrayBuffer) {
            var u8 = new Uint8Array(arrayBuffer);
            var decoder = new TextDecoder('utf-8');

            // 1. 순수 JSON 파일인지 선행 공백 검사
            var firstNonWs = 0;
            while (firstNonWs < u8.length && u8[firstNonWs] <= 32) firstNonWs++;
            if (u8[firstNonWs] === 123) { // '{' 문자로 시작하면 순수 JSON
                return JSON.parse(decoder.decode(u8));
            }

            // 2. TAR 아카이브 블록 순회하여 project.json 추출
            var offset = 0;
            while (offset + 512 <= u8.length) {
                var nameBytes = u8.slice(offset, offset + 100);
                var nullIdx = nameBytes.indexOf(0);
                var fileName = decoder.decode(nullIdx >= 0 ? nameBytes.slice(0, nullIdx) : nameBytes).trim();
                if (!fileName) break; // 아카이브 종료 빈 블록

                var sizeBytes = u8.slice(offset + 124, offset + 136);
                var sizeStr = decoder.decode(sizeBytes).trim();
                var size = parseInt(sizeStr, 8) || 0;

                offset += 512; // 헤더 이후 데이터 영역으로 이동
                if (fileName === 'project.json' || fileName.endsWith('/project.json')) {
                    var fileData = u8.slice(offset, offset + size);
                    return JSON.parse(decoder.decode(fileData));
                }

                // 512바이트 정렬 건너뛰기
                var remainder = size % 512;
                offset += size + (remainder !== 0 ? 512 - remainder : 0);
            }

            throw new Error('올바른 엔트리 프로젝트(.ent 아카이브 또는 .json) 형식이 아닙니다.');
        }

        /**
         * 내 컴퓨터에 백업 파일(.ent)로 내보내기 (공식 TAR 아카이브 다운로드)
         */
        function exportProjectToPC() {
            try {
                var projectData = Entry.exportProject();
                var safeName = (currentProjectName || 'entry_project').replace(/[/\\?%*:|"<>]/g, '_');
                var fileName = safeName + '_' + getFormattedBackupSuffix() + '.ent';

                // 엔트리 공식 규격: project.json을 TAR 아카이브로 패키징
                var jsonStr = JSON.stringify(projectData, null, 2);
                var tarBytes = createTarArchive([
                    { name: 'project.json', data: jsonStr }
                ]);

                var blob = new Blob([tarBytes], { type: 'application/octet-stream' });
                var url = URL.createObjectURL(blob);

                var a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                alert("파일 내보내기 중 오류가 발생했습니다: " + e.message);
            }
        }

        /**
         * 내 컴퓨터에서 백업 파일(.ent/.json) 열기
         */
        function handlePCFileOpen(event) {
            var file = event.target.files && event.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var parsedData = parseProjectFromTarOrJson(e.target.result);
                    Entry.clearProject();
                    Entry.loadProject(parsedData);
                    
                    currentProjectId = null;
                    currentProjectName = file.name.replace(/\.(ent|json)$/i, '');
                    var titleInput = document.getElementById('project-title-input');
                    if (titleInput) titleInput.value = currentProjectName;
                    updateSaveBadge('modified', 'PC파일 로드');

                    closeLoadModal();
                    if (window.syncEntryBlockCount) {
                        setTimeout(window.syncEntryBlockCount, 100);
                    }
                    alert("PC 백업 파일 [" + file.name + "] 을 성공적으로 불러왔습니다!");
                } catch(err) {
                    alert("파일을 읽을 수 없거나 올바른 엔트리 프로젝트 파일이 아닙니다: " + err.message);
                }
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        /**
         * 불러오기 모달창 열기 및 사용자 저장 목록 조회
         */
        function showLoadModal() {
            var modal = document.getElementById('load-modal');
            modal.style.display = 'flex';

            var container = document.getElementById('project-list-container');
            container.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">작품 목록을 불러오는 중...</p>';

            // 저장 목록 조회 API 호출
            fetch('/api/entry/projects?type=sandbox')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                container.innerHTML = '';
                if (!data.projects || data.projects.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #666; padding: 30px;">저장된 작품(백업)이 없습니다.<br><small style="color: #94a3b8;">상단의 [저장하기] 또는 [다른 이름으로 저장]을 사용해보세요.</small></p>';
                    return;
                }

                // 각 작품을 카드 리스트 형태로 출력
                data.projects.forEach(function(proj) {
                    var item = document.createElement('div');
                    item.style.padding = '12px 14px';
                    item.style.border = '1px solid #e2e8f0';
                    item.style.borderRadius = '8px';
                    item.style.display = 'flex';
                    item.style.justifyContent = 'space-between';
                    item.style.alignItems = 'center';
                    item.style.background = '#f8fafc';
                    item.style.transition = 'all 0.2s';

                    if (proj.id === currentProjectId) {
                        item.style.borderColor = '#3b82f6';
                        item.style.background = '#eff6ff';
                    }

                    var leftDiv = document.createElement('div');
                    leftDiv.style.display = 'flex';
                    leftDiv.style.flexDirection = 'column';
                    leftDiv.style.gap = '4px';
                    leftDiv.style.cursor = 'pointer';
                    leftDiv.style.flexGrow = '1';
                    leftDiv.onclick = function() { loadSpecificProject(proj.id); };

                    var titleWrap = document.createElement('div');
                    titleWrap.style.display = 'flex';
                    titleWrap.style.alignItems = 'center';
                    titleWrap.style.gap = '8px';

                    var titleSpan = document.createElement('span');
                    titleSpan.innerText = proj.project_name;
                    titleSpan.style.fontWeight = '700';
                    titleSpan.style.color = '#1e293b';
                    titleSpan.style.fontSize = '0.95rem';
                    titleWrap.appendChild(titleSpan);

                    if (proj.project_name.includes('백업')) {
                        var tag = document.createElement('span');
                        tag.innerText = '백업본';
                        tag.style.fontSize = '0.72rem';
                        tag.style.padding = '1px 6px';
                        tag.style.borderRadius = '4px';
                        tag.style.background = '#0d9488';
                        tag.style.color = '#fff';
                        tag.style.fontWeight = '600';
                        titleWrap.appendChild(tag);
                    }

                    if (proj.id === currentProjectId) {
                        var activeTag = document.createElement('span');
                        activeTag.innerText = '현재 작업 중';
                        activeTag.style.fontSize = '0.72rem';
                        activeTag.style.padding = '1px 6px';
                        activeTag.style.borderRadius = '4px';
                        activeTag.style.background = '#3b82f6';
                        activeTag.style.color = '#fff';
                        activeTag.style.fontWeight = '600';
                        titleWrap.appendChild(activeTag);
                    }

                    leftDiv.appendChild(titleWrap);

                    var dateSpan = document.createElement('span');
                    var dateObj = new Date(proj.updated_at);
                    var dateStr = dateObj.getFullYear() + '-' + String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0') + ' ' + String(dateObj.getHours()).padStart(2, '0') + ':' + String(dateObj.getMinutes()).padStart(2, '0');
                    dateSpan.innerText = '최종 저장: ' + dateStr;
                    dateSpan.style.fontSize = '0.78rem';
                    dateSpan.style.color = '#64748b';
                    leftDiv.appendChild(dateSpan);

                    item.appendChild(leftDiv);

                    var btnGroup = document.createElement('div');
                    btnGroup.style.display = 'flex';
                    btnGroup.style.gap = '6px';

                    var loadBtn = document.createElement('button');
                    loadBtn.innerText = '열기';
                    loadBtn.className = 'cos-btn cos-btn-primary';
                    loadBtn.style.padding = '5px 12px';
                    loadBtn.style.fontSize = '0.82rem';
                    loadBtn.onclick = function(e) {
                        e.stopPropagation();
                        loadSpecificProject(proj.id);
                    };
                    btnGroup.appendChild(loadBtn);

                    var delBtn = document.createElement('button');
                    delBtn.innerText = '삭제';
                    delBtn.className = 'cos-btn';
                    delBtn.style.padding = '5px 10px';
                    delBtn.style.fontSize = '0.82rem';
                    delBtn.style.backgroundColor = '#ef4444';
                    delBtn.style.color = '#ffffff';
                    delBtn.style.border = 'none';
                    delBtn.onclick = function(e) {
                        e.stopPropagation();
                        deleteSpecificProject(proj.id, proj.project_name);
                    };
                    btnGroup.appendChild(delBtn);

                    item.appendChild(btnGroup);
                    container.appendChild(item);
                });
            })
            .catch(function(err) {
                container.innerHTML = '<p style="text-align: center; color: red;">오류 발생: 목록을 가져오지 못했습니다.</p>';
            });
        }

        /**
         * 모달창 닫기
         */
        function closeLoadModal() {
            document.getElementById('load-modal').style.display = 'none';
        }

        /**
         * 선택된 작품의 상세 데이터를 받아 엔트리 엔진에 주입합니다.
         */
        function loadSpecificProject(projectId) {
            fetch('/api/entry/projects/' + projectId)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success && data.project_data) {
                    Entry.clearProject();
                    var parsedData = JSON.parse(data.project_data);
                    Entry.loadProject(parsedData);
                    
                    currentProjectId = data.project_id;
                    currentProjectName = data.project_name || "작품";
                    var titleInput = document.getElementById('project-title-input');
                    if (titleInput) titleInput.value = currentProjectName;
                    
                    var dateObj = new Date(data.updated_at);
                    var timeStr = String(dateObj.getHours()).padStart(2, '0') + ':' + String(dateObj.getMinutes()).padStart(2, '0');
                    updateSaveBadge('saved', '불러옴 ' + timeStr);

                    closeLoadModal();
                    if (window.syncEntryBlockCount) {
                        setTimeout(window.syncEntryBlockCount, 100);
                    }
                    alert("[" + currentProjectName + "] 작품을 성공적으로 불러왔습니다!");
                } else {
                    alert("작품 불러오기 실패: " + data.message);
                }
            })
            .catch(function(err) {
                alert("서버 통신 중 오류가 발생했습니다.");
            });
        }

        /**
         * 저장된 작품 삭제 기능
         */
        function deleteSpecificProject(projectId, projectName) {
            if (!confirm("[" + projectName + "] 작품을 정말로 삭제하시겠습니까? (삭제 후 복구할 수 없습니다)")) {
                return;
            }

            fetch('/api/entry/projects/' + projectId, {
                method: 'DELETE'
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    if (currentProjectId === projectId) {
                        currentProjectId = null;
                        updateSaveBadge('', '새 작품');
                    }
                    showLoadModal(); // 목록 새로고침
                } else {
                    alert("삭제 실패: " + data.message);
                }
            })
            .catch(function(err) {
                alert("삭제 통신 중 오류가 발생했습니다.");
            });
        }

        /**
         * 단축키 등록 (Ctrl+S: 저장, Ctrl+Shift+S: 다른 이름으로 저장)
         */
        window.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                if (e.shiftKey) {
                    saveProjectAs();
                } else {
                    saveProject();
                }
            }
        });
    </script>
</body>
