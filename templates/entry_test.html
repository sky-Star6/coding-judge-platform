<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>엔트리 로딩 진단 v3</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #eee; padding: 20px; }
        #log { background: #111; padding: 15px; border-radius: 8px; max-height: 250px; overflow-y: auto; font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
        .ok { color: #4caf50; }
        .err { color: #f44336; }
        .warn { color: #ff9800; }
        .info { color: #2196f3; }
        #entry-box { width: 100%; height: 600px; border: 2px dashed #555; }
    </style>
</head>
<body>
    <h2>🔍 엔트리 로딩 진단 v3</h2>
    <div id="log"></div>
    <div id="entry-box"></div>

    <script>
        function log(msg, type) {
            var el = document.getElementById('log');
            var line = document.createElement('div');
            line.className = type || 'info';
            line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            el.appendChild(line);
            el.scrollTop = el.scrollHeight;
        }
        window.onerror = function(msg, src, line, col, err) {
            var filename = src ? src.split('/').pop() : 'unknown';
            log('❌ JS 에러: ' + msg + ' (' + filename + ':' + line + ')', 'err');
        };
    </script>

    <!-- 1. 써드파티 -->
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular-route.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/16.14.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/16.14.0/umd/react-dom.production.min.js"></script>
    <script>log('✅ 써드파티 라이브러리 로딩 완료', 'ok');</script>

    <!-- 2. 엔트리 CSS -->
    <link rel="stylesheet" href="/lib/entryjs/dist/entry.css" />

    <!-- 3. EntryTool (GitHub에서 다운로드한 파일) -->
    <script src="{{ url_for('static', filename='js/entry-tool.js') }}"></script>
    <script>
        if (typeof EntryTool !== 'undefined') log('✅ EntryTool 로딩 성공', 'ok');
        else log('❌ EntryTool 실패', 'err');
    </script>

    <!-- 4. EntryVideoLegacy 심(shim) - 비디오 기능 스텁 -->
    <script>
        // EntryVideoLegacy는 웹캠/비디오 관련 레거시 모듈입니다.
        // 블록코딩 자체에는 필요 없으므로, 빈 객체로 등록하여 에러를 방지합니다.
        window.EntryVideoLegacy = function() {};
        EntryVideoLegacy.prototype = {
            init: function() {},
            turnOnWebcam: function() {},
            turnOffWebcam: function() {},
            setOptions: function() {},
            getFrame: function() { return null; },
            destroy: function() {}
        };
        log('✅ EntryVideoLegacy 심(shim) 등록 완료', 'ok');
    </script>

    <!-- 5. 엔트리 유틸리티 -->
    <script src="/lib/entryjs/extern/util/filbert.js"></script>
    <script src="/lib/entryjs/extern/util/CanvasInput.js"></script>
    <script src="/lib/entryjs/extern/util/ndgmr.Collision.js"></script>
    <script src="/lib/entryjs/extern/util/handle.js"></script>
    <script src="/lib/entryjs/extern/util/bignumber.min.js"></script>
    <script src="/lib/entryjs/extern/util/static.js"></script>
    <script>log('✅ 유틸리티 로딩 완료', 'ok');</script>

    <!-- 6. 엔트리 코어 -->
    <script src="/lib/entryjs/extern/lang/ko.js"></script>
    <script>log('📦 엔트리 코어 로딩 시작 (파일 큼, 잠시 대기)...');</script>
    <script src="/lib/entryjs/dist/entry.js"></script>
    <script>
        if (typeof Entry !== 'undefined') {
            log('✅ Entry 객체 존재', 'ok');
            log('   Entry.init: ' + (typeof Entry.init), 'info');
            log('   Entry.loadProject: ' + (typeof Entry.loadProject), 'info');
            if (typeof Entry.init === 'function') {
                log('🎉🎉🎉 Entry.init이 함수! 초기화 가능!!! 🎉🎉🎉', 'ok');
            } else {
                log('❌ Entry.init이 여전히 함수가 아닙니다', 'err');
            }
        } else {
            log('❌ Entry 없음', 'err');
        }
    </script>

    <!-- 7. 초기화 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Entry === 'undefined' || typeof Entry.init !== 'function') {
                log('❌ Entry.init 불가', 'err');
                return;
            }
            var container = document.getElementById('entry-box');
            try {
                Entry.init(container, {
                    type: 'workspace',
                    textCodingEnable: true,
                    libDir: '/lib/entryjs/extern',
                    entryDir: '/lib/entryjs/dist'
                });
                log('✅ Entry.init() 성공!', 'ok');
                setTimeout(function() {
                    try {
                        window.dispatchEvent(new Event('resize'));
                        Entry.loadProject();
                        log('✅ Entry.loadProject() 성공! 블록이 나타나야 합니다!', 'ok');
                    } catch(e2) {
                        log('❌ loadProject: ' + e2.message, 'err');
                    }
                }, 500);
            } catch(e) {
                log('❌ init: ' + e.message, 'err');
            }
        });
    </script>
</body>
</html>
