<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알고리즘 훈련장 - 인증</title>
    <!-- 프리텐다드 웹폰트 (Pretendard Font) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 공통 사이트 셸 스타일시트 (Shared Site Shell CSS) -->
    <link rel="stylesheet" href="/static/css/platform-shell.css">
    <style>
        /* 인증 페이지 전용 스타일 (Auth Page Specific Styles) */
        body {
            background-color: var(--color-bg-base);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background-color: var(--color-bg-surface);
            border: 1px solid var(--color-border-default);
            border-radius: var(--border-radius-lg);
            padding: 36px 32px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        }

        .auth-header {
            margin-bottom: 28px;
            text-align: left;
        }

        .auth-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            line-height: 1.4;
        }

        .auth-divider {
            border: 0;
            border-top: 1px solid var(--color-border-subtle);
            margin: 24px 0 16px 0;
        }

        .section-caption {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row > .form-group {
            flex: 1;
        }

        .auth-btn {
            width: 100%;
            margin-top: 8px;
        }

        .auth-nav {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--color-border-subtle);
            text-align: center;
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .auth-nav-link {
            color: var(--color-accent);
            font-weight: 600;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            font-size: inherit;
            font-family: inherit;
        }

        .auth-nav-link:hover {
            color: var(--color-accent-hover);
            text-decoration: underline;
        }

        .auth-sub-links {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.8rem;
        }

        .auth-sub-links a {
            color: var(--color-text-muted);
            text-decoration: none;
            cursor: pointer;
            padding: 4px;
        }

        .auth-sub-links a:hover {
            color: var(--color-text-primary);
            text-decoration: underline;
        }

        .message-area {
            margin-top: 16px;
            min-height: 24px;
            font-size: 0.875rem;
            text-align: center;
        }

        .error-msg {
            color: var(--color-danger);
            background-color: var(--color-danger-bg);
            border: 1px solid var(--color-danger-border);
            padding: 10px 14px;
            border-radius: var(--border-radius-md);
            display: inline-block;
            width: 100%;
            text-align: left;
        }

        .success-msg {
            color: var(--color-success);
            background-color: var(--color-success-bg);
            border: 1px solid var(--color-success-border);
            padding: 10px 14px;
            border-radius: var(--border-radius-md);
            display: inline-block;
            width: 100%;
            text-align: left;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 28px 20px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <main class="auth-wrapper">
        <!-- 1. 로그인 영역 (Login Panel) -->
        <section class="auth-card" id="login-box" aria-labelledby="login-heading">
            <header class="auth-header">
                <h1 id="login-heading">로그인</h1>
                <p>알고리즘 훈련장 계정으로 로그인하여 학습을 시작하세요.</p>
            </header>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-id">아이디</label>
                    <input type="text" class="form-input" id="login-id" required autocomplete="username" placeholder="아이디를 입력하세요">
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-pw">비밀번호</label>
                    <input type="password" class="form-input" id="login-pw" required autocomplete="current-password" placeholder="비밀번호를 입력하세요">
                </div>
                <button type="submit" class="btn btn-primary auth-btn" id="login-btn-submit">로그인</button>
            </form>
            <div id="login-msg" class="message-area" role="alert" aria-live="polite"></div>
            <nav class="auth-nav">
                <div>계정이 없으신가요? <button type="button" class="auth-nav-link" onclick="toggleMode('signup')">회원가입</button></div>
                <div class="auth-sub-links">
                    <a onclick="toggleMode('find-id')">아이디 찾기</a>
                    <span>|</span>
                    <a onclick="toggleMode('find')">비밀번호 찾기</a>
                </div>
            </nav>
        </section>

        <!-- 2. 회원가입 영역 (Signup Panel) -->
        <section class="auth-card" id="signup-box" style="display: none;" aria-labelledby="signup-heading">
            <header class="auth-header">
                <h1 id="signup-heading">회원가입</h1>
                <p>기본 계정 정보와 학생 정보를 입력해 주세요.</p>
            </header>
            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label" for="signup-id">아이디</label>
                    <input type="text" class="form-input" id="signup-id" required autocomplete="username" placeholder="영문 및 숫자 입력">
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-pw">비밀번호</label>
                    <input type="password" class="form-input" id="signup-pw" required autocomplete="new-password" placeholder="비밀번호 입력">
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-pw-confirm">비밀번호 확인</label>
                    <input type="password" class="form-input" id="signup-pw-confirm" required autocomplete="new-password" placeholder="비밀번호 재입력">
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-nick">닉네임</label>
                    <input type="text" class="form-input" id="signup-nick" required placeholder="화면에 표시될 이름">
                </div>

                <hr class="auth-divider">
                <div class="section-caption">학생 인적사항 (승인 및 비밀번호 찾기용)</div>

                <div class="form-group">
                    <label class="form-label" for="signup-birth">생년월일</label>
                    <input type="text" class="form-input" id="signup-birth" required placeholder="예: 20100512 (숫자 8자리)">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="signup-school">소속 학교</label>
                        <input type="text" class="form-input" id="signup-school" required placeholder="예: 구미중학교">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="signup-grade">학년</label>
                        <input type="text" class="form-input" id="signup-grade" required placeholder="예: 3학년">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-phone">전화번호</label>
                    <input type="text" class="form-input" id="signup-phone" required placeholder="예: 010-1234-5678">
                </div>

                <button type="submit" class="btn btn-primary auth-btn">가입 신청하기</button>
            </form>
            <div id="signup-msg" class="message-area" role="alert" aria-live="polite"></div>
            <nav class="auth-nav">
                <div>이미 계정이 있으신가요? <button type="button" class="auth-nav-link" onclick="toggleMode('login')">로그인 화면으로</button></div>
            </nav>
        </section>

        <!-- 3. 비밀번호 찾기 영역 (Find Password Panel) -->
        <section class="auth-card" id="find-box" style="display: none;" aria-labelledby="find-pw-heading">
            <header class="auth-header">
                <h1 id="find-pw-heading">비밀번호 찾기</h1>
                <p>가입 시 등록했던 계정 및 인적사항을 입력하세요.</p>
            </header>
            <form id="find-form">
                <div class="form-group">
                    <label class="form-label" for="find-id">가입 아이디</label>
                    <input type="text" class="form-input" id="find-id" required placeholder="아이디 입력">
                </div>
                <div class="form-group">
                    <label class="form-label" for="find-birth">생년월일</label>
                    <input type="text" class="form-input" id="find-birth" required placeholder="예: 20100512">
                </div>
                <div class="form-group">
                    <label class="form-label" for="find-phone">전화번호</label>
                    <input type="text" class="form-input" id="find-phone" required placeholder="예: 010-1234-5678">
                </div>
                <button type="submit" class="btn btn-primary auth-btn">비밀번호 확인</button>
            </form>
            <div id="find-msg" class="message-area" role="alert" aria-live="polite"></div>
            <nav class="auth-nav">
                <div>기억이 나셨나요? <button type="button" class="auth-nav-link" onclick="toggleMode('login')">로그인 화면으로</button></div>
            </nav>
        </section>

        <!-- 4. 아이디 찾기 영역 (Find ID Panel) -->
        <section class="auth-card" id="find-id-box" style="display: none;" aria-labelledby="find-id-heading">
            <header class="auth-header">
                <h1 id="find-id-heading">아이디 찾기</h1>
                <p>가입 시 등록했던 인적사항을 입력하세요.</p>
            </header>
            <form id="find-id-form">
                <div class="form-group">
                    <label class="form-label" for="find-id-birth">생년월일</label>
                    <input type="text" class="form-input" id="find-id-birth" required placeholder="예: 20100512">
                </div>
                <div class="form-group">
                    <label class="form-label" for="find-id-phone">전화번호</label>
                    <input type="text" class="form-input" id="find-id-phone" required placeholder="예: 010-1234-5678">
                </div>
                <button type="submit" class="btn btn-primary auth-btn">아이디 확인</button>
            </form>
            <div id="find-id-msg" class="message-area" role="alert" aria-live="polite"></div>
            <nav class="auth-nav">
                <div>기억이 나셨나요? <button type="button" class="auth-nav-link" onclick="toggleMode('login')">로그인 화면으로</button></div>
            </nav>
        </section>
    </main>

    <script>
        // 이미 로그인된 세션(Session) 정보가 브라우저에 남아있다면 곧바로 통합 학습 자료실(materials.html)로 자동 리다이렉트(Redirect)합니다.
        if (localStorage.getItem('user_id')) {
            window.location.href = 'materials.html';
        }

        const API_BASE_URL = '/api';
        let currentMode = 'login'; // 'login', 'signup', 'find', 'find-id'

        // 뷰 모드 전환 함수
        function toggleMode(mode) {
            currentMode = mode;
            document.getElementById('login-box').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('signup-box').style.display = mode === 'signup' ? 'block' : 'none';
            document.getElementById('find-box').style.display = mode === 'find' ? 'block' : 'none';
            document.getElementById('find-id-box').style.display = mode === 'find-id' ? 'block' : 'none';

            // 모드 전환 시 메시지 초기화
            document.getElementById('login-msg').innerHTML = '';
            document.getElementById('signup-msg').innerHTML = '';
            document.getElementById('find-msg').innerHTML = '';
            document.getElementById('find-id-msg').innerHTML = '';
        }

        // --- 로그인 처리 (Login Handler) ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgBox = document.getElementById('login-msg');
            const submitBtn = document.getElementById('login-btn-submit');

            msgBox.innerHTML = '<span style="color: var(--color-text-muted);">로그인 처리 중입니다...</span>';
            submitBtn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('login-id').value,
                        password: document.getElementById('login-pw').value
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    // 로그인 인증 성공 시 로컬 스토리지(LocalStorage)에 계정 정보를 저장하고 통합 학습 자료실(materials.html)로 이동합니다.
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('nickname', data.nickname);
                    localStorage.setItem('role', data.role);
                    msgBox.innerHTML = '<span class="success-msg">로그인 성공! 학습 자료실로 이동합니다.</span>';
                    setTimeout(() => window.location.href = 'materials.html', 600);
                } else {
                    msgBox.innerHTML = `<span class="error-msg">${data.detail || '로그인에 실패했습니다.'}</span>`;
                }
            } catch (err) {
                msgBox.innerHTML = `<span class="error-msg">인증 서버와 연결할 수 없습니다. 잠시 후 다시 시도해주세요.</span>`;
            }
            submitBtn.disabled = false;
        });

        // --- 회원가입 처리 (Signup Handler) ---
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgBox = document.getElementById('signup-msg');

            const pw = document.getElementById('signup-pw').value;
            const pwConfirm = document.getElementById('signup-pw-confirm').value;
            if (pw !== pwConfirm) {
                msgBox.innerHTML = '<span class="error-msg">비밀번호가 일치하지 않습니다. 다시 확인해주세요.</span>';
                return;
            }

            msgBox.innerHTML = '<span style="color: var(--color-text-muted);">가입 요청을 전송하고 있습니다...</span>';

            try {
                const res = await fetch(`${API_BASE_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('signup-id').value,
                        password: pw,
                        nickname: document.getElementById('signup-nick').value,
                        birth_date: document.getElementById('signup-birth').value,
                        school_name: document.getElementById('signup-school').value,
                        grade: document.getElementById('signup-grade').value,
                        phone_number: document.getElementById('signup-phone').value
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    toggleMode('login');
                    document.getElementById('login-id').value = document.getElementById('signup-id').value;
                    document.getElementById('login-pw').value = '';
                    document.getElementById('login-msg').innerHTML = '<span class="success-msg">가입 신청이 완료되었습니다. 관리자의 승인 후 로그인하실 수 있습니다.</span>';
                    document.getElementById('signup-form').reset();
                } else {
                    msgBox.innerHTML = `<span class="error-msg">${data.detail || '회원가입에 실패했습니다.'}</span>`;
                }
            } catch (err) {
                msgBox.innerHTML = `<span class="error-msg">인증 서버와 연결할 수 없습니다.</span>`;
            }
        });

        // --- 비밀번호 찾기 처리 (Find Password Handler) ---
        document.getElementById('find-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgBox = document.getElementById('find-msg');
            msgBox.innerHTML = '<span style="color: var(--color-text-muted);">계정 정보를 조회하고 있습니다...</span>';

            try {
                const res = await fetch(`${API_BASE_URL}/find-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('find-id').value,
                        birth_date: document.getElementById('find-birth').value,
                        phone_number: document.getElementById('find-phone').value
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    msgBox.innerHTML = `<div class="success-msg">확인 완료: 등록된 비밀번호는 <strong>${data.password}</strong> 입니다.</div>`;
                } else {
                    msgBox.innerHTML = `<span class="error-msg">${data.detail || '일치하는 계정 정보를 찾을 수 없습니다.'}</span>`;
                }
            } catch (err) {
                msgBox.innerHTML = `<span class="error-msg">서버 통신 오류가 발생했습니다.</span>`;
            }
        });

        // --- 아이디 찾기 처리 (Find ID Handler) ---
        document.getElementById('find-id-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgBox = document.getElementById('find-id-msg');
            msgBox.innerHTML = '<span style="color: var(--color-text-muted);">계정 정보를 조회하고 있습니다...</span>';

            try {
                const res = await fetch(`${API_BASE_URL}/find-id`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        birth_date: document.getElementById('find-id-birth').value,
                        phone_number: document.getElementById('find-id-phone').value
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    msgBox.innerHTML = `<div class="success-msg">확인 완료: 등록된 아이디는 <strong>${data.username}</strong> 입니다.</div>`;
                } else {
                    msgBox.innerHTML = `<span class="error-msg">${data.detail || '일치하는 가입 정보를 찾을 수 없습니다.'}</span>`;
                }
            } catch (err) {
                msgBox.innerHTML = `<span class="error-msg">서버 통신 오류가 발생했습니다.</span>`;
            }
        });
    </script>
</body>

</html>
