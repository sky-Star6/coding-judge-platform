<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알고리즘 훈련장 - 정답 관리 (어드민)</title>
    <!-- 공통 사이트 셸 스타일시트 (Shared Platform Shell CSS) -->
    <link rel="stylesheet" href="/static/css/platform-shell.css">
    <!-- 공통 테마 토글 및 조기 복원 스크립트 (Shared Theme Toggle Script) -->
    <script src="/static/js/theme-toggle.js"></script>
    <style>
        [data-theme="dark"] {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --bg-header: #333333;
            --text-main: #d4d4d4;
            --text-muted: #858585;
            --border-color: #3e3e42;
            --accent-color: #9C27B0;
            --accent-hover: #ba3dd1;
            --success: #89d185;
            --error: #f48771;
            --nav-bg: #444444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        header {
            background-color: var(--bg-header);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .admin-nav {
            display: flex;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 0 30px;
        }

        .admin-nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 15px 20px;
            font-weight: bold;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .admin-nav a:hover {
            color: white;
            background-color: var(--nav-bg);
        }

        .admin-nav a.active {
            color: var(--accent-color);
            border-bottom: 3px solid var(--accent-color);
            background-color: rgba(156, 39, 176, 0.1);
        }

        .container {
            max-width: 95%;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        h2 {
            margin-top: 0;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-size: 0.95rem;
            background-color: rgba(255, 255, 255, 0.02);
        }

        select,
        input,
        textarea {
            background-color: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
        }

        button {
            border: 1px solid var(--border-color);
            cursor: pointer;
            border-radius: 4px;
        }

        button.action-btn {
            border: 1px solid transparent;
            cursor: pointer;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
        }

        /* [기본/다크 테마] btn-edit */
        .btn-edit {
            background-color: #2196F3;
            color: #ffffff;
            border-color: #1e88e5;
        }

        .btn-edit:hover {
            background-color: #1976D2;
            border-color: #1565C0;
            color: #ffffff;
        }

        .btn-edit:focus-visible {
            outline: 2px solid #2196F3;
            outline-offset: 2px;
        }

        /* [기본/다크 테마] btn-delete */
                .btn-delete {
                    background-color: var(--error);
                    color: #ffffff;
                    border-color: var(--error);
                }

        .btn-delete:hover {
            background-color: #fca590;
            border-color: #fca590;
            color: #000000;
        }

        .btn-delete:focus-visible {
            outline: 2px solid var(--error);
            outline-offset: 2px;
        }

        /* [라이트 테마] btn-edit */
        [data-theme="light"] .btn-edit {
            background-color: #1d4ed8;
            color: #ffffff;
            border: 1px solid #1e40af;
        }

        [data-theme="light"] .btn-edit:hover {
            background-color: #1e40af;
            border-color: #172554;
            color: #ffffff;
        }

        [data-theme="light"] .btn-edit:focus-visible {
            outline: 2px solid #1d4ed8;
            outline-offset: 2px;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.35);
        }

        /* [라이트 테마] btn-delete */
        [data-theme="light"] .btn-delete {
            background-color: #dc2626;
            color: #ffffff;
            border: 1px solid #b91c1c;
        }

        [data-theme="light"] .btn-delete:hover {
            background-color: #b91c1c;
            border-color: #991b1b;
            color: #ffffff;
        }

        [data-theme="light"] .btn-delete:focus-visible {
            outline: 2px solid #dc2626;
            outline-offset: 2px;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.35);
        }

        /* 수정 모달 스타일 (admin_problems 화면 흉내) */
        .modal-content.large {
            width: 800px;
            /* 더 넓게 */
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            margin: 5vh auto;
            /* 상단 여백 조절 */
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .testcase-group {
            border: 1px dashed var(--border-color);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .tc-remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            color: var(--error);
            border: 1px solid var(--error);
            font-size: 0.7rem;
            padding: 2px 5px;
            cursor: pointer;
        }

        /* [29단계] 스마트폰 기능 대응: 헤더, 메뉴바 스와이프 강제 지원 및 팝업창 제한 */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 15px;
            }
            .admin-nav {
                overflow-x: auto;
                white-space: nowrap;
                padding: 0 10px;
            }
            .admin-nav a {
                padding: 10px;
                font-size: 0.9rem;
            }
            .container {
                padding: 0 10px;
                margin: 15px auto;
            }
            .modal-content.large {
                width: 90% !important;
                margin: 10% auto !important;
                padding: 15px !important;
            }
        }

        /* [34단계] 페이지네이션 */
        .pagination { display:flex; justify-content:center; gap:5px; margin-top:15px; flex-wrap:wrap; }
        .page-btn { padding:5px 10px; background:var(--bg-panel); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; cursor:pointer; font-size:0.85rem; }
        .page-btn:hover { background:#3a3a3d; }
        .page-btn.active { background:var(--accent-color); color:white; border-color:var(--accent-color); }

        /* [37단계] 드래그앤드롭 스타일 */
        .drag-handle { cursor: grab; font-size: 1.2rem; user-select: none; text-align: center; }
        .drag-handle:active { cursor: grabbing; }
        tr.dragging { opacity: 0.4; background: #555 !important; }
        tr.drag-over { border-top: 3px solid var(--accent-color) !important; }
        .filter-bar { margin-top: 20px; display:flex; align-items:center; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
        .filter-btn { padding:6px 14px; background:var(--bg-dark); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; cursor:pointer; font-size:0.85rem; }
        .filter-btn:hover { background:#3a3a3d; }
        .filter-btn.active { background:var(--accent-color); color:white; border-color:var(--accent-color); }
        .reorder-info { color:var(--accent-color); font-size:0.85rem; display:none; }
    
        .header-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 4px;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .header-btn:hover {
            background-color: var(--nav-hover, #e2e8f0);
        }
    </style>

    <link rel="icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
</head>

<body>

    <header>
        <a href="index.html" class="header-title">마이로봇코딩 <span
                style="font-size: 0.6em; color: var(--accent-color);">[등록된 문제 관리]</span></a>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
            <button class="header-btn" onclick="window.location.href='settings.html'">설정</button>
            <button class="header-btn" onclick="window.location.href='index.html'">홈으로 가기</button>
        </div>
    </header>

    <!-- 관리자용 세 갈래 네비게이션 탭 -->
    <div class="admin-nav">
        <a href="admin_users.html">회원 관리</a>
        <a href="admin_problems.html">새 문제 출제</a>
        <a href="admin_problems_list.html" >등록된 문제 관리</a>
        <a href="admin_assignments.html">과제/숙제 관리</a>
        <a href="admin_points.html">포인트 관리</a>
            <a href="admin_answers.html" class="active">정답 관리</a>
    </div>

    
    <div class="container">
        <div class="panel">
            <h2>문제 정답 관리</h2>
            
            
            <div style="margin-bottom: 20px;">
                <button id="btn-python" onclick="loadAnswers('python')" style="background-color: var(--accent-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px;">Python 정답 보기</button>
                <button id="btn-java" onclick="loadAnswers('java')" style="background-color: #555; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Java 정답 보기</button>
            </div>
            
            <div style="margin-bottom: 20px;">
                <span style="color:var(--text-muted); margin-right:10px; font-weight:bold;">급수 필터:</span>
                <button id="btn-diff-all" onclick="setDifficulty('all')" style="background-color: var(--accent-color); color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px;">전체</button>
                <button id="btn-diff-0" onclick="setDifficulty(0)" style="background-color: #555; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px;">입문</button>
                <button id="btn-diff-1" onclick="setDifficulty(1)" style="background-color: #555; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px;">3급</button>
                <button id="btn-diff-3" onclick="setDifficulty(3)" style="background-color: #555; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px;">2급</button>
                <button id="btn-diff-5" onclick="setDifficulty(5)" style="background-color: #555; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer;">1급</button>
            </div>


            <div id="problem-list" style="display: grid; gap: 10px;">
                <!-- Problems will be injected here -->
            </div>
        </div>
    </div>

    <!-- Answer Modal -->
    <div id="answer-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
        <div class="modal-content" style="background:var(--bg-panel); width:80%; max-width:800px; max-height:80vh; border-radius:8px; display:flex; flex-direction:column; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            <div style="padding:15px 20px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                <h3 id="modal-title" style="margin:0; color:var(--text-main);">정답 확인</h3>
                <button onclick="closeModal()" style="background:transparent; border:none; color:var(--text-muted); font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div style="padding:20px; overflow-y:auto; flex-grow:1;">
                <pre><code id="modal-code" style="display:block; background:var(--bg-dark); padding:15px; border-radius:4px; color:var(--success); white-space:pre-wrap; font-family:monospace;"></code></pre>
            </div>
            <div style="padding:15px 20px; border-top:1px solid var(--border-color); text-align:right;">
                <button onclick="closeModal()" style="background:var(--nav-bg); color:white; padding:8px 16px; border:none; border-radius:4px; cursor:pointer;">닫기</button>
            </div>
        </div>
    </div>

    <script>
        
        let currentLang = 'python';
        let currentDiff = 'all';
        let allProblems = [];

        async function init() {
            try {
                const res = await fetch('/api/admin/problems_with_answers');
                allProblems = await res.json();
                renderList();
            } catch (err) {
                console.error(err);
                alert("데이터를 불러오는데 실패했습니다.");
            }
        }

        function setDifficulty(diff) {
            currentDiff = diff;
            renderList();
        }

        function loadAnswers(lang) {
            currentLang = lang;
            renderList();
        }

        function renderList() {
            document.getElementById('btn-python').style.backgroundColor = currentLang === 'python' ? 'var(--accent-color)' : '#555';
            document.getElementById('btn-java').style.backgroundColor = currentLang === 'java' ? 'var(--accent-color)' : '#555';
            
            document.getElementById('btn-diff-all').style.backgroundColor = currentDiff === 'all' ? 'var(--accent-color)' : '#555';
            document.getElementById('btn-diff-0').style.backgroundColor = currentDiff === 0 ? 'var(--accent-color)' : '#555';
            document.getElementById('btn-diff-1').style.backgroundColor = currentDiff === 1 ? 'var(--accent-color)' : '#555';
            document.getElementById('btn-diff-3').style.backgroundColor = currentDiff === 3 ? 'var(--accent-color)' : '#555';
            document.getElementById('btn-diff-5').style.backgroundColor = currentDiff === 5 ? 'var(--accent-color)' : '#555';

            const listDiv = document.getElementById('problem-list');
            listDiv.innerHTML = '';

            const filtered = allProblems.filter(p => {
                const langMatch = currentLang === 'python' ? p.has_python : p.has_java;
                const diffMatch = currentDiff === 'all' ? true : (p.difficulty === currentDiff);
                return langMatch && diffMatch;
            });
            
            if (filtered.length === 0) {
                listDiv.innerHTML = '<p style="color:var(--text-muted);">조건에 맞는 정답이 없습니다.</p>';
                return;
            }

            filtered.forEach(p => {
                const diffStr = ['입문', '3급', '2급', '1급'][p.difficulty === 0 ? 0 : (p.difficulty === 1 ? 1 : (p.difficulty === 3 ? 2 : 3))] || p.difficulty;
                const div = document.createElement('div');
                div.style.padding = '15px';
                div.style.backgroundColor = 'var(--bg-dark)';
                div.style.border = '1px solid var(--border-color)';
                div.style.borderRadius = '4px';
                div.style.cursor = 'pointer';
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';
                
                div.onmouseover = () => div.style.borderColor = 'var(--accent-color)';
                div.onmouseout = () => div.style.borderColor = 'var(--border-color)';
                div.onclick = () => openModal(p.id, p.title);
                
                div.innerHTML = `
                    <div>
                        <span style="color:var(--accent-color); font-weight:bold; margin-right:10px;">[${diffStr}]</span>
                        <span style="color:var(--text-main); font-size:1.1rem;">${p.display_id}. ${p.title}</span>
                    </div>
                    <span style="color:var(--text-muted);">정답 보기 &rarr;</span>
                `;
                listDiv.appendChild(div);
            });
        }

        async function openModal(id, title) {
            try {
                const res = await fetch(`/api/problems/${id}/answer?lang=${currentLang === 'python' ? 'python3' : 'java'}`);
                if (!res.ok) throw new Error("정답을 불러올 수 없습니다.");
                const data = await res.json();
                
                document.getElementById('modal-title').textContent = `${title} (${currentLang.toUpperCase()} 정답)`;
                                let safeAnswer = data.answer || "등록된 코드가 없습니다.";
                safeAnswer = safeAnswer.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                safeAnswer = safeAnswer.replace(/\[\[(.*?)\]\]/g, '<span style="background-color: rgba(255, 235, 59, 0.3); color: #FFEB3B; padding: 0 4px; border-radius: 3px; font-weight: bold;">$1</span>');
                document.getElementById('modal-code').innerHTML = safeAnswer;
                document.getElementById('answer-modal').style.display = 'flex';
            } catch (err) {
                alert(err.message);
            }
        }

        function closeModal() {
            document.getElementById('answer-modal').style.display = 'none';
        }

        window.onload = init;
    </script>
</body>
</html>
